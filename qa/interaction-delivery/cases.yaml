schemaVersion: 1
capability: interaction-delivery
requirementOwner: docs/requirements_and_learnings/capabilities/interaction-delivery.md
statusPolicy: Run results belong in dated, candidate-bound reports.
reports:
  - qa/voice/reports/2026-10-17-native-continuation-and-memory-recovery.md
sourceInventories:
  - qa/agent-config-continuity/cases.md
  - qa/agent-streaming-usage/cases.md
  - qa/citation-rendering/cases.md
  - qa/main-continuity/cases.md
  - qa/no-response/cases.md
journeys:
  - id: cross-surface-supersession
    requirements: [CC-043, CC-047, CC-048, CC-056, HARD-005, HARD-021, PW-076, PW-110, PW-111]
    userAction: Send rapid input and a correction before the first presentation commits while durable work or a callback continues.
    surfaces: [Web, Telegram, Voice, callback]
    expectedResult: One current Main presentation covers all unresolved input, while committed effects and accepted work happen once.
    degradedAndRecovery: Failed transcription, stale preview, closed stream, unavailable provider, and recoverable pending state remain distinct.
    persistenceAndCleanup: Reload and restart preserve the current presentation and exact origin binding without duplicate delivery.
    evidence: [visible transcript, ordered source segments, message parts, effect receipts, callback and delivery state]
  - id: main-natural-response
    requirements: [CORE-001, CORE-002, CORE-009, HARD-005, CC-047]
    userAction: From a new chat send one ordinary natural prompt, wait for the answer, reload, then send two rapid follow-ups before the first follow-up answer commits.
    surfaces: [Web, Telegram]
    expectedResult: One useful Main answer arrives in one conversation with one user row, one assistant row, one provider session, and stable navigation with no flicker or replay; reload shows the same conversation; the rapid follow-ups yield one current presentation with no connection error and no repeated side effects.
    degradedAndRecovery: Provider unavailable, timeout, rate limit, and isolation conflict each surface once as a typed state; a conflict is never treated as success and never triggers a resubmission with a new conversation.
    persistenceAndCleanup: Reload and restart preserve the conversation and answer; the synthetic conversation is removed through the supported owner path.
    evidence: [visible answer and URL, turn identity count, provider session and project counts, message rows, served client identity, send-to-first-visible timing]
  - id: finished-reply-after-connection-expiry
    requirements: [CORE-001, CC-043, CC-047, HARD-021, PW-111]
    userAction: Complete a harmless Direct reply and a native handoff reply, then reconnect after the temporary job is absent.
    surfaces: [Web, Telegram, Voice]
    expectedResult: The exact saved final text and authorized files are recovered once, without a new provider request or repeated tool effect.
    degradedAndRecovery: Partial, stopped, active or failed replies and changed source, ownership, revision, payload or files cannot become a recovered success. Concurrent acknowledgment and reconnect keep the exact presentation identity.
    persistenceAndCleanup: Reload and restart retain the same answer and acknowledgment; public reads and client writes cannot expose, forge or clear the private completion receipt.
    evidence: [visible recovered answer, final save transaction, source and payload identity, provider request count, attachment authorization, acknowledgment race and reload receipts]
  - id: attachment-only-input
    requirements: [CORE-001, CORE-006, CC-048, HARD-021]
    userAction: Send a completed document without a caption from Web and an audio file without a caption from Telegram; use a synthetic request whose authorized worker returns a small file. Compare with a native voice note.
    surfaces: [Web, Telegram, worker]
    expectedResult: The original attachment and empty authored text reach Main, its bound background cortices and any accepted worker with unchanged source identity. The useful reply and exact output file return in the same conversation.
    degradedAndRecovery: Empty input without selected files and pending or invalid uploads cannot send. Missing, stale or mismatched source identity and unauthorized files remain rejected. A native voice transcript uses the existing transcription path. Completed empty assistant status rows cannot block the next authored source; content-bearing or unfinished rows remain. Missing retained text is unavailable, while explicit empty extraction is valid.
    persistenceAndCleanup: Reload retains the visible input, reply and output file, including saved user rows with an empty structured content array. Saved input and result cards download the actual retained representation; original bytes remain exact, while declared extraction returns exact text with a .txt name. File-only edits and regeneration retain their exact selected files; no new blank turn can borrow files from history.
    evidence: [visible captionless send, source and upload ledger, worker receipt and result, downloaded file bytes, reload, admission and authorization tests]

  - id: durable-background-result-after-cache-loss
    requirements: [CC-043, CC-047, HARD-021, PW-076, PW-110, PW-111]
    userAction: Finish a harmless Main reply, retain one useful Main-authored Cortex addition, then expire or lose its temporary job and reconnect.
    surfaces: [Telegram, callback]
    expectedResult: The exact saved addition claims, authorizes and acknowledges once from canonical source and delivery receipts, with no model rerun or raw internal speech.
    degradedAndRecovery: Changed source or body, deleted or unfinished or failed child, wrong owner or channel, stale generation, live conflict and unknown transport fail closed. Invalid older candidates cannot starve a later valid owner.
    persistenceAndCleanup: Both supported job-store cache-loss paths and restart preserve the exact body, finite cohort and receipt; duplicate exact ACK is idempotent.
    evidence: [canonical parent and child, bound ingress, graph hashes, generation and lease, visible message, acknowledgment and provider request count]
  - id: obsolete-terminal-recovery-settles
    requirements: [CC-043, CC-047, CC-048, HARD-005, HARD-021]
    userAction: Recover a known failed older accepted reply after a later original source was answered.
    surfaces: [Telegram]
    expectedResult: The obsolete presentation recovery settles failed once without a repeated failure bubble, endless typing or renewed old lease; current reply remains intact.
    degradedAndRecovery: A later independent answer cannot declare unknown accepted action work complete; changed binding and missing failure proof preserve unknown work.
    persistenceAndCleanup: Restart and repeated recovery ticks retain original input and native work facts without execution replay.
    evidence: [visible idle status and current answer, original ingress and response binding, terminal failure, lease and native request count]
  - id: authored-result-delivery-bounded-retry
    requirements: [CC-043, HARD-021, PW-076, PW-110, PW-111]
    userAction: Finish a harmless worker result while its destination is unavailable, then restore the destination within the existing retry budget.
    surfaces: [Web, Telegram, Voice, callback]
    expectedResult: Main authors once; retry reuses that exact saved message and delivers once.
    degradedAndRecovery: Superseded callback settles once; permanent destination failure reaches typed delivery exhaustion at the existing limit and keeps authored text. Unlinked older owners cannot starve a linked owner.
    persistenceAndCleanup: Restart preserves result, attempts, exact owner and target; no worker replay or re-authoring.
    evidence: [authored message identity, accepted callback fence, delivery attempts and terminal state, visible result and native request count]

  - id: durable-chat-source-currency-after-retention
    requirements: [CC-043, CC-047, CC-048, HARD-005, HARD-021]
    userAction: Retain a failed old reply, then send a newer source that fails, start a new conversation, or expire temporary input records and restart the adapter.
    surfaces: [Telegram]
    expectedResult: Durable owner/chat/topic source authority settles only the obsolete failed presentation once, without old typing or execution replay.
    degradedAndRecovery: A failed merged A+B reply compares its actual presentation sequence and keeps one failure presentation; a complete cached reply before ACK remains presentable. Changed binding or unavailable proof never declares unknown accepted action work complete.
    persistenceAndCleanup: Saved original or native/host source proof survives ingress expiry; all original input and accepted native work facts remain.
    evidence: [durable source scope and presentation sequence, merged source IDs, exact response binding, terminal state, visible idle status and provider request count]

  - id: silent-main-delivery-receipt
    requirements: [CC-043, CC-047, CC-048, HARD-005, HARD-021]
    userAction: Ask Main to complete a harmless private review without a reply, then restart the adapter after its authored no-response final.
    surfaces: [Telegram]
    expectedResult: No marker, placeholder, speech or idle typing appears; the exact input completes through the existing quiet-delivery acknowledgment. Accepted canonical files retain their normal authorization and receipts without narration.
    degradedAndRecovery: Partial marker fragments stay hidden. A failed or stale stream cannot commit success. Use the actual attachment sender for confirmed file, confirmed unavailable notice, unknown send, missing receipt, failed notice and partial file acceptance. Uncertain files with no confirmed answer text record failed presentation with confirmed item references. A confirmed ordinary answer instead commits only confirmed text/file references and remains eligible for accepted memory; unknown file items are excluded and never resent. Acknowledgment outage retries only its durable receipt. A zero-item quiet acknowledgment failure stays silent, creates no pending retry/removal notice and retries the same saved final on input recovery. Check both cached and expired completed Main jobs through the actual Core input recovery consumer; failed presentation settles lease and retry to zero without model/action replay or changing Main's answer.
    persistenceAndCleanup: Replaying the same saved final retains its turn and revision, produces an idempotent acknowledgment, and neither reruns the model nor delivers a duplicate item. A body/source/current-author-validated completed final outranks the legacy unfinished presentation flag; absent or foreign proof cannot claim completed production. A useful later Cortex or worker result retains its separate ledger receipt after a zero-item Main receipt, without a duplicate Main send or raw status.
    evidence: [visible silence and idle status, exact source and turn, canonical final, acknowledgment and ingress state, provider request count, authorized attachment receipt]
