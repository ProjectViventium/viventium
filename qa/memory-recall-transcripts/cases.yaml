schemaVersion: 1
capability: memory-recall-transcripts
requirementOwner: docs/requirements_and_learnings/capabilities/memory-recall-transcripts.md
statusPolicy: Run results belong in dated, candidate-bound reports.
sourceInventories:
  - qa/conversation-recall-rag/cases.md
  - qa/meeting-transcript-memory/cases.md
  - qa/memory-continuity/cases.md
