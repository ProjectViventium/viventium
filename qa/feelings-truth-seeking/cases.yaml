schemaVersion: 1
capability: feelings-truth-seeking
requirementOwner: docs/requirements_and_learnings/capabilities/feelings-truth-seeking.md
statusPolicy: Run results belong in dated, candidate-bound reports.
sourceInventories:
  - qa/anti-sycophancy/cases.md
  - qa/emotional-cortex/cases.md
  - qa/red-team-cortex/cases.md
journeys:
  - id: installed-matrix
    requirements: [AS-001, AS-008]
    userAction: Use supported, refuted, uncertain, ordinary no-consult, and useful-challenge prompts on the installed product.
    surfaces: [Web, Telegram, Voice]
    expectedResult: Main is calibrated and useful, not reflexively agreeable or oppositional, and remains the final speaker.
    degradedAndRecovery: Consultant, provider, or memory failure is disclosed without invented evidence or a blocked ordinary answer.
    persistenceAndCleanup: Refresh, restart, Stop, and state reload preserve the correct result and leave isolated-account state clean.
    evidence: [visible or audible result, consultation graph, Feeling version, prompt lineage, installed identity]
  - id: retrieval-proof
    requirements: [AS-003, AS-007, AS-011]
    userAction: Ask a question whose useful answer requires one known synthetic prior fact, then repeat with retrieval unavailable.
    surfaces: [Web, retrieval service]
    expectedResult: A memory claim has a healthy owner-scoped same-run receipt; unavailable retrieval is not reported as absence.
    degradedAndRecovery: Later evidence may add one useful continuation but never rewrites the original answer; silence is valid.
    persistenceAndCleanup: Synthetic memory is removed after evidence capture and zero residue is proved.
    evidence: [visible answer, retrieval receipt, source scope, health and freshness state, cleanup proof]
  - id: isolated-account
    requirements: [AS-012, CORE-010]
    userAction: Run the acceptance matrix with an isolated governed account that has equivalent capabilities.
    surfaces: [all affected installed surfaces]
    expectedResult: Results prove the product without using personal data, prompts, accounts, or private runtime dumps.
    degradedAndRecovery: Missing equivalent capability blocks the affected case instead of weakening its expected result.
    persistenceAndCleanup: Capture sanitized evidence, remove synthetic state exactly, and prove no personal-account contamination.
    evidence: [account-scope proof, public-safety scan, cleanup receipt, remaining-gap record]
