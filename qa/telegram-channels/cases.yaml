journeys:
  - id: telegram-main-parity
    requirements: [CORE-002, CORE-007, CC-048]
    userAction: Send text, reply, document, photo, voice note, correction, and exact work control through Telegram Desktop.
    surfaces: [Telegram Desktop, Main, Active Work]
    expectedResult: Main receives exact ordered inputs, uses authorized capabilities, retracts stale preview when possible, and delivers one current useful result.
