journeys:
  - id: telegram-voice-preferences
    requirements: [TGVOICE-004, TGVOICE-006, TGVOICE-011, CORE-007]
    userAction: Open Telegram Preferences, inspect all three voice controls, change each independently, reopen and restart, then send voice notes and text with ordinary and text-only requests. Let a source-bound worker reply arrive later.
    surfaces: [Telegram Preferences, foreground Main, late worker reply, Core preferences, selected Speaking route]
    expectedResult: Master Switch gates all optional reply audio. Reply Voice with Voice permits spoken-input replies; Always Include Voice Reply is the broader option and permits all replies even when the spoken-input switch is OFF. All product defaults are ON, explicit saved choices remain unchanged, and model skip/ranges remain authoritative.
    degradedAndRecovery: Master OFF, model skip, invalid required audio metadata, text delivery failure and TTS failure remain distinct. Late or restarted callbacks retain their own source input mode; another chat input cannot change it. Global and multiuser changes sync the authenticated owner through the existing Core interface without a model call.
    persistenceAndCleanup: Reload and restart retain each selected value and Core agrees. Restore only the authorized user's requested final settings and retire exact synthetic QA resources. Keep raw prompts, audio and account evidence private.
    evidence: [all-flag deterministic matrix, legacy and missing-value defaults, exact-owner sync, saved preferences and Core mapping, installed candidate, visible labels and checked states, real voice input and audible reply, text-only and model-skip output, source-bound late callback]
  - id: telegram-main-parity
    requirements: [CORE-002, CORE-007, CC-048]
    userAction: Send text, reply, document, photo, voice note, correction, and exact work control through Telegram Desktop.
    surfaces: [Telegram Desktop, Main, Active Work]
    expectedResult: Main receives exact ordered inputs, uses authorized capabilities, retracts stale preview when possible, and delivers one current useful result.
    degradedAndRecovery: Download, transcription, provider, formatting, rate, and retraction failures stay distinct with one useful action.
    persistenceAndCleanup: Restart and native follow-up preserve owner and objective; synthetic messages, files, and work are removed exactly.
    evidence: [visible Telegram exchange, message parts, delivery ledger, file hashes, logs, cleanup proof]

  - id: ingress-outage-and-idle-typing
    requirements: [CORE-002, CORE-007, CC-048]
    userAction: In an isolated runtime, send a current message while Core cannot accept it; restore Core and send a new message. Separately recover a cancelled retained input, then remain idle.
    surfaces: [Telegram Desktop, Core ingress, retained input recovery]
    expectedResult: A definite pre-admission failure sends one plain reply to the exact current input without TTS, model work or typing. After recovery, the new input receives its normal answer. A terminal old presentation settles without restarting work or refreshing idle typing.
    degradedAndRecovery: An unknown POST outcome is never retried as fresh execution. A newer source suppresses the old notice. Transport failure and provider failure keep distinct wording. Background acknowledgement retries back off and recover without log floods. Authenticated prepared input survives an ordering outage in its existing ingress ledger; only a recoverable retained receipt permits a waiting notice. A late startup callback cannot change the identity of a cancelled pre-native reply or prevent its successor from authoring the exact sources.
    persistenceAndCleanup: Restart retains exact source and terminal facts; a newer independent message does not mark old work completed. Remove only synthetic fixtures through their owning cleanup path.
    evidence: [visible outage and recovery, exact source and delivery receipts, canonical failure and presentation state, absence of tool replay, bounded typing start/stop logs, installed artifact identity]
