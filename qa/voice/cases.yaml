journeys:
  - id: audible-main-and-interruption
    requirements: [CC-019, CC-049, PW-050, PW-051, PW-052, PW-053, VOICE-EFFECT-001]
    userAction: Start a real call, request one authorized durable effect, interrupt speech, recover, and hear the final result.
    surfaces: [installed Voice Call, linked chat, Active Work]
    expectedResult: The same Main speaks; stable barge-in suppresses stale audio; the effect happens once; concise completion is heard once and artifacts remain linked.
    degradedAndRecovery: Missing media, provider rejection, timeout, false interruption, hangup, and completed playback stay distinct. Denied, replayed, stale, wrong-owner, and wrong-revision bindings cause zero new effects and return durable typed truth.
    persistenceAndCleanup: Concurrency, crash, restart, reconnect, and candidate-to-predecessor compatibility preserve one accepted reversible provider effect, one immutable effect row, and matching delivery acknowledgement and audible or visible result. Synthetic call state is removed and raw audio retention remains zero.
    evidence: [audible observation, transcript, effect receipt, playback completion, call logs, installed artifact identity]
  - id: native-worker-question-in-main-call
    requirements: [PW-052, CC-049]
    userAction: During a call, receive a genuine typed native worker input request while Main is busy or on a later turn; answer its actual offered choice.
    surfaces: [installed Voice Call, linked chat, Active Work owner input]
    expectedResult: Main presents the actual question and offered choices once within the bounded presentation limit; the exact native request receives only the owner's offered choice. Permissions speak the available native human purpose and consent choices; Action details retains the exact operation without adding it to speech. The worker stays waiting until that control accepts the response; no internal status is spoken.
    degradedAndRecovery: Answered, replaced, expired, wrong-owner, wrong-call and terminated bindings admit no new speech or approval. A still-pending legacy request refreshes its existing question and delivery; lost acknowledgement retains the same operation.
    persistenceAndCleanup: Main completion or later turns do not discard the pending question. Reconnect uses one durable delivery; interruption records an unknown audible outcome without replaying or granting consent.
    evidence: [native request identity and offered choices, visible owner control, audible question and once-only receipt, speech trace, delivery ledger, native response acknowledgement]
  - id: native-clarification-form
    requirements: [PW-052, CC-049, CORE-005]
    userAction: Receive a genuine native clarification with offered single or multiple choices and optional Other notes; answer through Main or the existing owner form.
    surfaces: [installed Voice Call, linked chat, Active Work owner input, Telegram]
    expectedResult: The actual question is relayed, human controls hide transport JSON, native wire question keys and labels remain exact, and the existing native owner acknowledges the answer once. Permission choices remain distinct.
    degradedAndRecovery: Unsupported shapes, unknown or duplicate choices, invalid supplied Other notes, excess response size, stale requests and lost acknowledgement remain distinct; retained acknowledgement retries preserve the identical target and body.
    persistenceAndCleanup: The same durable callback and task keep the current question; no second manager, extra queue or multi-step Telegram draft framework is created.
    evidence: [actual native IPC request and response, bounded form and event tests, native acknowledgement receipt, actual configured provider elicitation, visible and audible channel acceptance]
  - id: listen-only-boundary
    requirements: [VOICE-001]
    userAction: Enable Listen-Only, speak synthetic content, switch modes, and inspect the transcript.
    surfaces: [installed Voice, transcript view]
    expectedResult: Visible ambient transcript appears with no assistant reply, TTS, tool call, mission, title, or normal recall entry.
    degradedAndRecovery: Uncertain speaker identity stays Unknown and unavailable transcription is truthful.
    persistenceAndCleanup: Mode change is atomic; removal deletes synthetic transcript state according to policy.
    evidence: [visible transcript, zero-response and zero-tool proof, mode state, cleanup proof]
  - id: telegram-call-public-edge
    requirements: [CC-057, CORE-007, CORE-008, CORE-009, PW-052]
    userAction: From a linked Telegram account send /call, tap the returned button once on a device on the serving Wi-Fi and once on a genuinely off-network device, talk to Main, and hang up.
    surfaces: [Telegram Desktop or mobile, public Playground call bootstrap over the custom-domain HTTPS edge, LiveKit media, linked chat]
    expectedResult: Each fresh link uses the configured public playground origin and carries its single-use launch bearer only in the fragment; the page bootstraps, auto-connects, a worker joins, speech is transcribed, Main answers audibly, hangup completes, the linked chat persists, and replaying a used link returns the honest expired-or-used message.
    degradedAndRecovery: Same-network failure with off-network success requires route and DNS evidence before assigning a cause; do not assume router NAT loopback, split DNS or an application regression from that comparison alone; missing public URL, expired session, wrong owner, media not established, and worker not joined stay distinct; remote-access status never claims off-network reachability this Mac did not observe.
    persistenceAndCleanup: The call session ends and is cleaned, raw audio retention stays zero, the linked chat keeps the transcript, and no second Call URL scheme, tunnel, certificate trick, or hosts-file workaround is introduced.
    evidence: [visible Telegram button and URL origin, bootstrap result per network class, exchange 200 then 410 on replay, worker join and transcript rows, audible reply, hangup and cleanup counts, remote-access status wording, donor cases TR-012 MPV-045 REMOTE-UC-004 REMOTE-UC-005]
  - id: local-call-entry
    requirements: [CORE-005, CORE-007, CORE-008, CORE-009, CC-057, PW-052]
    userAction: Select Call on this Mac in the supported macOS helper, sign in if needed, then activate the focused normal Call control. Compare with a call started from the public web UI on a phone.
    surfaces: [macOS helper, authenticated local web chat, installed Playground, phone public web Call]
    expectedResult: Open and Call on this Mac use the same reachable loopback web-app origin rather than a discovered LAN address. Normal sign-in is used if no browser session exists. The helper reaches the existing local Call control with the normal saved assistant and route. Only the user's normal Call click or Enter creates the signed conversation-bound call. Local runtime identity and health are checked independently of the public browser URL; a host without public loopback can still admit a public-origin call to its healthy internal runtime.
    degradedAndRecovery: A URL hint or external navigation alone creates no call, popup or microphone capture. Signed-out, disabled Voice, unsupported native runtime, missing assistant, unavailable runtime and wrong build remain truthful. A healthy public response cannot hide an unhealthy or stale configured runtime. Denied microphone, public DNS drift, same-WiFi routing, media failure and expired or used launches stay distinct. Headers followed by a stalled body must hit the existing deadline; unmount cancellation remains effective and a later keepalive, settings read or task action can recover without a wedged in-flight guard.
    persistenceAndCleanup: The focus hint is consumed once and preserved through ordinary sign-in without granting audio authority. Reopen, reload and Back do not start another call. End and reconnect use existing ownership and linked transcript. Keep saved Listening/Speaking, models and cognitive configuration unchanged.
    evidence: [before-and-after causal route tests, helper build and installed identity, actual helper menu and browser focus, zero automatic call creation, actual user Call gesture, call and worker identity, received speech and transcript, degraded and recovery receipts]
  - id: foreground-native-question-speech
    requirements: [PW-052, CC-049, CORE-005]
    surfaces: [installed Voice Call]
    userAction: During an active Main generation, receive a current native question without sentence punctuation; hear it while the native provider waits.
    expectedResult: Main authors the human question from the current native offer before provider resume, once per exact request. Exact operation and offered response bindings stay in owner controls; raw internal permission text is not spoken. Stop, replacement, remote answer, expiry and disconnect deny stale speech. Auxiliary question text does not change provider response or resume accounting.
    degradedAndRecovery: An uncertain claim or connection produces no replay; an answered or replaced native request cannot gain authority from retained task state.
    persistenceAndCleanup: Request-specific receipt survives coalesced snapshots and process restart without claiming audible completion.
    evidence: [current native request read, atomic VoiceTask speech offer, paused TTS flush, actual audible question, provider resume accounting]
  - id: optional-call-context-preparation
    requirements: [VOICE-PREP-001, CORE-002, CORE-006, CORE-007, CORE-009]
    surfaces: [installed Voice Call, linked chat, Telegram call launch, Prompt Workbench]
    userAction: Enable preparation, open settings without starting, then start calls from new and existing conversations; speak during preparation and after it, use exact Stop or End, and reload.
    expectedResult: Settings and Listen-Only invoke no Main. Actual Start admits one normal Main context turn with its configured route and fallback. A visible silent report and progress use existing surfaces; next Voice input uses the same admitted conversation and ordinary Voice override, with all authorized cognitive/tool capabilities retained.
    degradedAndRecovery: Provider failure, approval, concurrent Main, deadline, cancelled preparation and restart remain truthful. Waiting input is retained by existing source ordering; stale preparation cannot reopen End or speak through reconnect. Other workers keep normal delivery.
    persistenceAndCleanup: The Call binds its exact idempotent generation and absolute deadline; canonical result persists. Cancellation neither archives an existing chat nor cancels unrelated committed work. Keep raw prompts/evidence private.
    evidence: [source-to-compiled prompt lineage, exact Main and Voice execution receipts, durable call/job/task/message joins, configured-model positive/negative/adjacent evaluations, browser progress and report, received silent/audio proof, startup and first/warm-turn timing]

  - id: native-stream-no-polling-delay
    requirements: [VOICE-PERF-002, CORE-005, CORE-006]
    surfaces: [xPerfect streaming API, installed Voice Call]
    userAction: Ask for a multi-part spoken reply, then Stop or replace its current turn.
    expectedResult: Durable output wakes the current exact attempt without a fixed delivery sleep. Eligible text can stream before native completion; hidden text and stale output stay silent. Terminal and fallback transitions use the same wake mechanism.
    degradedAndRecovery: Lost or cross-process hints use bounded reconciliation. Replaced and closed subscriptions reject queued old-generation hints. No hint grants source or effect authority.
    persistenceAndCleanup: Subscriptions and file watches close; progress and result persistence remain authoritative. Record real observation passes, wait time and process CPU separately from isolated wake latency.
    evidence: [source identity, generation race tests, affected native output tests, real received audio and native/text clocks, content-free observation summary, process CPU window]
  - id: xperfect-livekit-reference
    requirements: [VOICE-XP-LK-001, VOICE-PERF-002, CORE-005]
    surfaces: [standalone xPerfect API, official LiveKit SDK, reference integration]
    userAction: Follow the reference setup, hear a streamed answer, interrupt it, ask a new question and recall the prior topic.
    expectedResult: Stable room and distinct turn identities preserve one native conversation. Typed audio decisions reach the SDK before text is discarded or spoken. Early stream close calls the exact existing native cancel endpoint once; terminal completion sends no cancel.
    degradedAndRecovery: Missing or malformed speech decisions remain silent. Native cancellation keeps false or unknown capacity explicit. The SDK AEC warmup setting is documented because it can withhold initial user speech; an echo-free test uses the existing zero setting without changing hardware echo protection by assumption.
    persistenceAndCleanup: Close the created room and owned clients. Do not claim Core memory, Feelings or permissions migrated through a base URL. Mark live in-flight cancellation, reconnect, background callbacks and unheard-tail history checks separately.
    evidence: [actual SDK parser tests, current-run authorization tests, mixed range tests, received audio, complete interruption transcript, correct follow-up and context recall, cleanup receipt]
  - id: native-process-warm-count
    requirements: [VOICE-WARM-001, CORE-005, CORE-006, GOV-013]
    surfaces: [xPerfect worker configuration, Queen and ordinary worker, native runtime]
    userAction: Save zero and a supported positive warm count through the existing worker settings, reload, use the worker, interrupt an active native tool and continue the same conversation.
    expectedResult: The count describes real initialized idle native processes and has one saved configuration owner. Queen and worker consume the same setting; model, effort, selected account, lane and current attempt stay exact. Zero preserves ordinary execution.
    degradedAndRecovery: Unsupported profiles and account projections are explicit. Optional attach failure before session/prompt uses the same-model cold path; accepted prompts are never replayed. Failed starts, uncertain Stop, concurrent close, orphan recovery and PID reuse never silently release capacity or signal an unrelated process. Startup recovery runs even with zero, paused or unusable settings. Full Stop proof does not hold the runtime-wide process lock.
    persistenceAndCleanup: Native tools and escaped descendants are proved stopped by the existing owner before resource release; saved conversation history survives clean eviction and active Stop. Idle expiry, pause, termination and shutdown leave no owned live process.
    evidence: [saved configuration and reload, native status and process identities, model and effort receipts, cold and warm native clocks, exact Stop and next-turn history, restart and cleanup evidence]

  - id: plain-action-native-execution
    requirements: [PW-050, PW-052, CORE-005]
    surfaces: [installed Voice Call, native xPerfect harness, actual browser or local workspace, linked chat]
    userAction: Ask to open a harmless public page in a new browser tab without naming a tool or worker. Repeat with an authorized local file task and an ordinary conversational question. Compare the exact plain request through the configured Chat route.
    expectedResult: In a configured Queen/worker split, the Queen receives a real durable-worker acceptance; direct execution counts only for a single-executor setup. The selected route then reports the actual result or needed input. The real page or file exists. Conversation-only input needs no tool. The user does not supply orchestration instructions.
    degradedAndRecovery: A promise without an action is a failed case even if the provider reports completion. Wrong handoffs, unavailable tools and missing permission remain distinct. Keep the original failed receipt when retrying; do not silently switch models or infer Voice parity from Chat success.
    persistenceAndCleanup: Join the original input, exact native run, tool result and visible effect. Preserve user data and unrelated work; remove only disposable test artifacts through their supported recovery path. Keep raw personal history and provider context private.
    evidence: [exact configured model and effort, input and native attempt joins, real tool acceptance or completion, visible page or file, spoken claim, source and runtime identity, separate original and retry outcomes]

  - id: direct-queen-independent-action-handoff
    requirements: [PW-050, PW-052, CORE-005]
    surfaces: [installed Voice Call, xPerfect Direct Queen, configured native workers, linked chat]
    userAction: Speak two independent ordinary action goals without naming a provider or tool, then ask a conversational question. Include one browser action and one downloadable artifact.
    expectedResult: In coordination mode the Direct Queen has hand_off_to and list_workers as its work tools; schedules, search, files and diagnostics remain worker capabilities. The Queen obtains distinct durable worker receipts through the existing broker, without writing a replacement task brief. Workers receive the selected original input and authorized inherited context through existing snapshots and readers. Configured worker models and fallback stay independent of the Queen. Conversation continues; each actual result returns through the Queen once, with the real page or downloadable file.
    degradedAndRecovery: Preserve failed tool attempts and report their actual result. Conversation-only and planning-only requests need no action. Missing acceptance is not success. A route change and an effort change are separate choices; neither is hidden. A supported durable background follow-up is not evidence of mid-reply interjection. Include a settled blank preparation row with bound retrieval evidence; later voice turns must preserve it as untrusted data and keep provider history consistent with source integrity.
    persistenceAndCleanup: Join speech transcription, Queen tool calls, exact workers, callback destinations, persisted chat and received audio. Record whether later input actually overlapped running work. End the owned test call normally; preserve unrelated work.
    evidence: [selected Queen and worker configuration, real RTC transcript and PCM, distinct accepted work receipts, worker execution bindings, visible browser effect, downloaded file contents, callback presentation receipts, stage timings, separate native and Direct results]

  - id: live-core-outage-retains-original-speech
    requirements: [CC-019, PW-051, CORE-005, VOICE-EFFECT-001]
    userAction: In an isolated owned local call, stop only the owned Core process after the call reaches Listening, inject a clear first utterance while Core is unavailable, let the supported supervisor restore Core, then speak a second utterance and end normally.
    surfaces: [installed Voice Call, received RTC audio, linked chat, durable source and task state]
    expectedResult: "The first exact transcript reaches the existing ordered call-owned admission and receives the real answer after recovery; the second turn also answers. Repeat with an ordinary first action request: verified physical-owner attribution and the Queen's authorized handoff tools must survive recovery, then a real native worker accepts and completes the effect. Arithmetic alone does not prove action parity. No duplicate native action, silent dropped first input, provider-failure claim or fake success notice is allowed."
    degradedAndRecovery: Repeat with original A/B/C interruptions and A/empty/C order, End during outage, a current Listen-Only or passive Wing result, interim and final shared-mic safety state, consumed Wing receipt recovery, revocation and a timeout after Core receives the body. Definite connection refusal and typed retryable pre-launch 503 retain the same original source; ambiguous action acceptance never re-POSTs. No repeat-request notice may play while the source still retries; final notices require current authoritative Call mode. Guest ambient evidence retries its same idempotent segment/revision without granting actions or blocking owner admission. While mode is suspended, only a final non-diarizing source from the exact signed owner microphone may retain pending attribution; fresh Call with the exact retained Core mode revision and unchanged source/track may resolve its same segment with a new speaker revision. An unseen Call-to-Wing/Listen-Only-to-Call change, missing/invalid revision, fresh Wing, Listen-Only, replaced track, guest, shared-mic or overlap remains restricted. A pending-only recovery read never restores audio authority. Fresh authority and audio gates remain enforced.
    persistenceAndCleanup: Required speaker safety and Wing preflight share the existing retained admission owner. In-flight safety settles before source POST and an unconfirmed tombstone returns to the tracker. End drains HTTP, preflight, ambient and acknowledgement tasks; no old source is sent after close. Ordinary healthy Call adds no standalone speaker-persistence POST or fresh-authority GET ahead of canonical ingress; caption delivery cannot hold it.
    evidence: [actual owned process identity and recovery, STT source text, original source IDs and POST order, genuine ready receipt, received PCM and audible answer, second-turn reply, exact effect count, close cleanup]
