schemaVersion: 1
capability: parallel-work
requirementOwner: docs/requirements_and_learnings/capabilities/parallel-work.md
statusPolicy: Run results belong in dated, candidate-bound reports.
sourceInventories:
  - qa/parallel-orchestrator/cases.md
journeys:
  - id: PAR-QA-RESPONSIVE-001
    requirements: [PW-022, PW-068, PW-069, PWK-038]
    userAction: Give Main independent substantial goals in ordinary language, including a native app/computer task and a non-file outcome; ask a quick question while they run and steer only the relevant goal. Do not tell Main when to use workers. Two goals are a minimum overlap case, not a capacity limit.
    surfaces: [Telegram, Web, Active Work]
    expectedResult: Main delegates through model judgment, answers promptly, and preserves unrelated work. Distinct tool-scoped effectOccurrenceRefs admit each objective once, with overlap when capacity permits. Each worker can use the native harness capabilities authorized for its goal; useful results appear once without a new message or reload. File creation is optional unless requested.
    degradedAndRecovery: Exact replay returns the same receipt; changed payload under the same reference fails closed; capacity shortage stays queued truthfully.
    persistenceAndCleanup: Restart preserves both missions and one result each; synthetic work and artifacts are removed exactly.
    evidence: [source order, effect receipts, mission rows, overlap timing, visible useful reply with correlated admission/queue/native work/forwarding/channel timing and no demonstrated avoidable application delay, actual native tool calls and permissions, useful live results, cleanup proof]
  - id: PAR-QA-SILENT-TERMINAL-001
    requirements: [PW-026, PW-027, PW-028]
    userAction: Start two independent synthetic jobs, stop only one, and ask Main a simple question while the other continues.
    surfaces: [Web, Telegram, Voice, Active Work]
    expectedResult: Only the selected job stops. Main answers, the sibling completes once, and ordinary silent outcomes settle without a presenter, pending delivery or repeated work reads. A cortex does not turn its own read-only limits into claims about other actors.
    degradedAndRecovery: Retained terminal enqueued rows heal only from exact authoritative silent evidence. Foreign or stale evidence and a newer run or generation cannot be overwritten.
    persistenceAndCleanup: Reload preserves the stopped and completed states. The next current roster clears settled work without hiding another active mission. Preserve scoped audit receipts.
    evidence: [exact Stop action and sibling run identity, canonical result, silent delivery state, three reconciliation passes without repeated settled-work reads, fresh cortex disposition, next-turn roster and actual reloaded surface]
  - id: PAR-QA-PERF-001
    requirements: [PW-092]
    userAction: Change focused or parallel mode and send focused-mode control requests under representative load.
    surfaces: [Web, Telegram, settings API]
    expectedResult: Mode-write server latency is below 100 ms and focused-mode overhead is below 25 ms p95 with no extra model or network request.
    degradedAndRecovery: Unavailable preference state falls back truthfully without delaying the turn.
    persistenceAndCleanup: The account-wide setting persists and the synthetic account is restored.
    evidence: [server timing, model-call count, network trace, persisted preference]
  - id: PAR-QA-PERF-002
    requirements: [PW-093]
    userAction: Open and refresh Active Work with warm, cold, stale, and unavailable roster state.
    surfaces: [Web, Active Work API]
    expectedResult: Local snapshot is below 50 ms p95, cold ceiling is 100 ms, and stale behavior follows the current two-second configurable default.
    degradedAndRecovery: Stale and unavailable are never rendered as empty; refresh recovers when authority returns.
    persistenceAndCleanup: Snapshot state never becomes a second authority or persisted chat content.
    evidence: [latency distribution, cache age, roster authority, visible state]
  - id: PAR-QA-PERF-003
    requirements: [PW-094]
    userAction: Invoke an authorized delegation with warm and cold harness conditions measured separately.
    surfaces: [Core tool boundary, GlassHive]
    expectedResult: Dispatch after tool invocation is below 150 ms p95 and the 250 ms release ceiling, excluding measured harness startup.
    degradedAndRecovery: Admission failure, provider start delay, and harness startup remain distinct.
    persistenceAndCleanup: A timed-out attempt cannot create a late duplicate mission.
    evidence: [tool timestamp, admission timestamp, dispatch timestamp, harness-start measurement, mission count]
  - id: PAR-QA-E2E-001
    requirements: [PW-098]
    userAction: Run two overlapping artifact missions, ask a quick question, revise one late input, Steer only A, and open both outputs.
    surfaces: [installed Telegram, headed Web, Active Work]
    expectedResult: Main remains responsive, B is unchanged, and two distinct valid files are delivered exactly once. A Web callback's imported file link opens the owner-authenticated host copy with its original filename and bytes; canonical text and content remain intact through a subsequent protected Main turn; native grants and remote-channel attachment delivery remain intact.
    degradedAndRecovery: A stale or late result cannot replace the current answer or affect the other mission. If the exact source completes or fails during an already accepted Steer, its reserved correction survives with immutable source history and exact release proof. Stop, closure, changed lifecycle generation, and changed mission attachment prevent stale control effects; an unapplied action retains the draft and reports the no-op truthfully.
    persistenceAndCleanup: Reload and restart preserve both work records and artifacts before exact cleanup.
    evidence: [visible transcript, action receipt, attempt and lease state, artifact hashes, callback and delivery rows]
  - id: PAR-QA-E2E-002
    requirements: [PW-099]
    userAction: Exercise duplicate and out-of-order input, failure, recovery, restart, owner isolation, fallback, callbacks, scheduler, and applicable Voice or media paths. Queue a continuation on Web-origin work from its linked Telegram chat.
    surfaces: [all affected installed surfaces]
    expectedResult: Each path keeps the same authorized outcome, one owner, exact controls, and truthful lifecycle state. The first run returns its file while the successor runs. The continuation sends its own result once to the accepted Telegram chat and topic without a status request.
    degradedAndRecovery: Capacity, provider, auth, native-child, delivery, and rollback failures stay distinct and recover safely.
    persistenceAndCleanup: Restart and rollback lose no accepted work and leak no cross-owner state.
    evidence: [real user output, authority and isolation proof, lifecycle state, callbacks, artifacts, installed identity]
  - id: PAR-QA-EVIDENCE-001
    requirements: [PW-100]
    userAction: Correlate the changed user journey with only the supporting system evidence needed for that seam.
    surfaces: [Telegram Desktop, headed Web, audible Voice when applicable]
    expectedResult: Visible or audible behavior agrees with source, state, attempts, leases, callbacks, delivery, artifacts, generated config, pins, builds, and installed process.
    degradedAndRecovery: Missing required real-surface or artifact evidence makes the result PARTIAL or BLOCKED, never PASS.
    persistenceAndCleanup: Agent-sync drift and dry-run checks run only when that seam changes; public evidence is sanitized and synthetic state is removed.
    evidence: [candidate-bound report, hashes, redacted trace, cleanup proof, remaining gaps]
  - id: PAR-QA-NATIVE-COORDINATION-001
    requirements: [PW-050, PW-052, PW-098, PW-099, CORE-005]
    userAction: In saved coordination mode, give an ordinary authorized action request, omit optional historical-file and current-source selections (including a combined current input), receive its result, then continue the conversation. Also test a Worker launched from an earlier result and retrieval of an accepted file that was never presented. Repeat the owning contract across Codex, Claude and Direct.
    surfaces: [Telegram, Web, Voice, native harness]
    expectedResult: Queen has the existing hand_off_to, active_work_action and list_workers controls without a second synchronous host-graph action menu. Workers receive exact selected original input and authorized context, retain native action capabilities and configured effort, and return through the same Queen once. Long task text is preserved; Native capacity owns admission. Background browser work preserves the user's active tab and input.
    degradedAndRecovery: Missing browser consent and an unavailable optional connector are distinct. Connector failure cannot remove independent authorized handoff. A forced unavailable graph transfer fails clearly. Stored worker results recover without rerunning completed work. Full mode retains its graph behavior.
    persistenceAndCleanup: Reload keeps original source, exact work identity and one delivered result. Preserve unrelated work and account settings; end owned test calls normally.
    evidence: [profile and role matrix, exact source hashes, real tool and permission receipts, callback and roster consumers, artifact download hashes, visible reloaded result, configured and loaded source identity, remaining physical audio or browser-consent gates]
  - id: PAR-QA-PLANNING-RETRY-001
    requirements: [PW-050, PW-098, PW-099, CORE-005]
    userAction: Recover an accepted interactive request whose native planner failed before creating a goal. Use Retry in Active Work, including a duplicate or lost-response recovery.
    surfaces: [Web, Active Work, native harness]
    expectedResult: One durable retry child inherits the exact original message and selected Library context through fresh authorized preparation. Failed history remains intact. The parent card gives way to the accepted child, then current goals and one useful result. No new handoff flag or replacement brief is required.
    degradedAndRecovery: Foreign, stopped, held, unsettled, completed and already-dispatched sources cannot start another plan. An existing child is recovered without another effect. Expired native replies stay invalid; a new question uses its current run and attempt.
    persistenceAndCleanup: Restart preserves the accepted source, child relationship and one delivery. Retain scoped audit evidence and leave unrelated work unchanged.
    evidence: [original source equality, retry receipt, child and provider identities, outbox identity, current permission preparation, visible parent-child transition, result count, retained state after reload and restart]

  - id: PAR-QA-RESULT-CLAIM-001
    requirements: [PW-028, PW-099, CORE-007]
    userAction: Pause a synthetic result author after its draft, reclaim the same evidence row with the same attempt and timestamp, then resume the earlier author. Repeat for success and retryable or permanent failure.
    surfaces: [Main result author, callback queue, persisted delivery]
    expectedResult: Only the current exact claim can write a draft, Main reply, delivery or settlement. The replaced author cannot mutate the new claim. A valid current claimant still delivers once.
    degradedAndRecovery: An accepted callback receipt alone does not retain processing authority. Existing transaction recovery and exact source guards remain active.
    persistenceAndCleanup: Reopening storage retains the current claim and one result. Retire only synthetic rows through their existing owner.
    evidence: [causal stale-claim unit tests, real replica-set transaction cases, claim and delivery state, actual source/result association]
  - id: PAR-QA-BROKER-INGRESS-001
    requirements: [PW-050, CORE-005, CORE-007]
    userAction: Supply synthetic reserved broker grant fields and MCP aliases in model launch arguments. Compare unrelated context and a trusted fresh Core action bundle.
    surfaces: [Core tool ingress, Native coordinator preparation]
    expectedResult: Model arguments cannot create broker authority. Fresh Core-prepared grants remain usable; unrelated original context and configuration remain intact.
    degradedAndRecovery: Missing real authority fails without a new grant or alternate transport. An unavailable optional connector does not remove independent authorized handoff controls.
    persistenceAndCleanup: Preserve the same accepted source, scope and existing action receipts. No account or policy reset.
    evidence: [raw ingress attack tests, trusted action positive cases, Core and Native consumer tests, exact prepared grant provenance]
