<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">The genie is real</title>
  <desc id="desc">Vertical Reel frame introducing the extraordinary usefulness of everyday AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9fbff"/><stop offset="1" stop-color="#edf1ff"/></linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d8cff"/><stop offset="1" stop-color="#3949bd"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset="0.4" stop-color="#a7b2ff" stop-opacity="0.72"/><stop offset="1" stop-color="#6d5ce7" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="20" stdDeviation="23" flood-color="#283169" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="940" cy="170" r="270" fill="#dfe5ff" opacity="0.65"/><circle cx="80" cy="1780" r="230" fill="#e5e1ff" opacity="0.55"/>
  <text x="70" y="94" fill="#44506a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="5">VIVENTIUM</text>
  <text x="1010" y="94" text-anchor="end" fill="#6b7488" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650">01 / 06</text>
  <text x="70" y="280" fill="#171d2c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="92" font-weight="800">The genie</text>
  <text x="70" y="382" fill="#171d2c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="92" font-weight="800">is real.</text>
  <text x="70" y="462" fill="#48536a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32">Ask almost anything.</text>
  <text x="70" y="510" fill="#48536a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32">Get useful work in seconds.</text>
  <g transform="translate(290 610)">
    <circle cx="250" cy="330" r="360" fill="url(#glow)" filter="url(#soft)"/>
    <path d="M222 700 C82 515 448 500 282 320 C176 204 370 134 270 28" fill="none" stroke="#7b83ef" stroke-width="42" stroke-linecap="round" opacity="0.38"/>
    <path d="M250 698 C410 548 112 440 270 260 C366 154 180 92 260 14" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" opacity="0.95"/>
    <path d="M155 650 H345 L320 730 H180 Z" fill="#5260d2"/>
    <rect x="176" y="708" width="148" height="64" rx="20" fill="#4351c4"/>
    <path d="M118 764 C118 704 172 686 196 724 H304 C328 686 382 704 382 764 V870 C382 922 338 956 250 956 C162 956 118 922 118 870 Z" fill="url(#bottle)" filter="url(#shadow)"/>
    <path d="M154 806 C214 782 286 782 346 806" fill="none" stroke="#aeb7ff" stroke-width="9" stroke-linecap="round" opacity="0.7"/>
    <circle cx="250" cy="870" r="41" fill="#e1e5ff"/><path d="M231 870 L247 886 L276 850" fill="none" stroke="#4553c4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="540" y="1715" text-anchor="middle" fill="#39465e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="760">But power is not the same as truth.</text>
  <path d="M70 1810 H1010" stroke="#cbd2e2" stroke-width="1.5"/><text x="70" y="1860" fill="#7b8498" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">THE VIVENTIUM WAY</text>
</svg>
