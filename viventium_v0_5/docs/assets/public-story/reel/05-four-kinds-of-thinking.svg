<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">One answer, four kinds of thinking</title>
  <desc id="desc">Vertical Reel frame explaining the four plain-language parts of the Viventium philosophy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#edf8f3"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#243c54" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/><circle cx="100" cy="80" r="175" fill="#e2e9ff" opacity="0.62"/><circle cx="1015" cy="1810" r="250" fill="#dff4ea" opacity="0.65"/>
  <text x="70" y="94" fill="#465369" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="5">VIVENTIUM</text><text x="1010" y="94" text-anchor="end" fill="#6d788a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650">05 / 06</text>
  <text x="70" y="250" fill="#192437" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="68" font-weight="800">One answer.</text><text x="70" y="328" fill="#192437" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="68" font-weight="800">Four kinds of thinking.</text>
  <text x="70" y="388" fill="#526276" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28">Do more of the right thinking before speaking.</text>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="120" y="500" fill="#5b6780" font-size="18" font-weight="800" letter-spacing="3">ALWAYS WORKING TOGETHER</text>
    <path d="M170 560 V985" stroke="#aeb9cf" stroke-width="5" stroke-linecap="round"/>
    <g filter="url(#shadow)"><circle cx="170" cy="650" r="88" fill="#687de6"/><circle cx="170" cy="900" r="88" fill="#8466c7"/></g>
    <text x="310" y="630" fill="#26344a" font-size="31" font-weight="800">KNOW YOUR WORLD</text><text x="310" y="676" fill="#526276" font-size="23">Memory, priorities, history and current work.</text>
    <text x="310" y="880" fill="#26344a" font-size="31" font-weight="800">THINK QUIETLY IN BACKGROUND</text><text x="310" y="926" fill="#526276" font-size="23">Specialists keep looking for missed details and risks.</text>
    <text x="120" y="1085" fill="#5b6780" font-size="18" font-weight="800" letter-spacing="3">WHEN MORE TRUTH IS NEEDED</text>
    <path d="M170 1145 V1570" stroke="#aeb9cf" stroke-width="5" stroke-linecap="round"/>
    <g filter="url(#shadow)"><circle cx="170" cy="1235" r="88" fill="#2f9b79"/><circle cx="170" cy="1485" r="88" fill="#2b6f78"/></g>
    <text x="310" y="1215" fill="#26344a" font-size="31" font-weight="800">CHECK REALITY</text><text x="310" y="1261" fill="#526276" font-size="23">Evidence, likelihood and real experience.</text>
    <text x="310" y="1465" fill="#26344a" font-size="31" font-weight="800">CHALLENGE ITSELF</text><text x="310" y="1511" fill="#526276" font-size="23">Try to disprove the first answer.</text>
    <rect x="110" y="1650" width="860" height="112" rx="56" fill="#20354d"/>
    <text x="540" y="1696" text-anchor="middle" fill="#9fe0c2" font-size="19" font-weight="800" letter-spacing="3">ONE VOICE SPEAKS LAST</text><text x="540" y="1735" text-anchor="middle" fill="#ffffff" font-size="24">Known · likely · uncertain · still worth checking</text>
  </g>
  <text x="70" y="1860" fill="#7b8795" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">THE VIVENTIUM WAY</text>
</svg>
