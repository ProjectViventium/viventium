<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">The fix is a fuller picture</title>
  <desc id="desc">Vertical Reel frame showing three dimensions of a grounded answer: the person's world, the real world and a challenge to the first answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#eef8f4"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#234052" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/><circle cx="110" cy="100" r="195" fill="#e0eaff" opacity="0.6"/><circle cx="1010" cy="1800" r="240" fill="#dff4ea" opacity="0.65"/>
  <text x="70" y="94" fill="#465369" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="5">VIVENTIUM</text><text x="1010" y="94" text-anchor="end" fill="#6d788a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650">04 / 06</text>
  <text x="70" y="260" fill="#192437" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="70" font-weight="800">The fix is a</text><text x="70" y="340" fill="#192437" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="70" font-weight="800">fuller picture.</text>
  <text x="70" y="404" fill="#355d58" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="29">Not more disagreement. Better grounding first.</text>
  <g filter="url(#shadow)"><circle cx="350" cy="860" r="245" fill="#6379e6" fill-opacity="0.84"/><circle cx="730" cy="860" r="245" fill="#2d9a76" fill-opacity="0.83"/><circle cx="540" cy="1160" r="245" fill="#8466c7" fill-opacity="0.8"/></g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <text x="320" y="760" fill="#ffffff" font-size="28" font-weight="800">UNDERSTAND</text><text x="320" y="800" fill="#ffffff" font-size="28" font-weight="800">YOUR WORLD</text><text x="320" y="846" fill="#edf0ff" font-size="19">priorities · history · work</text>
    <text x="760" y="760" fill="#ffffff" font-size="28" font-weight="800">CHECK THE</text><text x="760" y="800" fill="#ffffff" font-size="28" font-weight="800">REAL WORLD</text><text x="760" y="846" fill="#ebfff7" font-size="19">evidence · likelihood</text>
    <text x="540" y="1230" fill="#ffffff" font-size="28" font-weight="800">CHALLENGE THE</text><text x="540" y="1270" fill="#ffffff" font-size="28" font-weight="800">FIRST ANSWER</text><text x="540" y="1316" fill="#f3edff" font-size="19">blind spots · weak assumptions</text>
    <circle cx="540" cy="965" r="132" fill="#ffffff" stroke="#d6e1e6" stroke-width="2"/>
    <text x="540" y="940" fill="#18352f" font-size="23" font-weight="800">A GROUNDED</text><text x="540" y="984" fill="#18352f" font-size="38" font-weight="830">ANSWER</text><text x="540" y="1026" fill="#687b78" font-size="18">honest about certainty</text>
    <text x="540" y="1585" fill="#355d58" font-size="31" font-weight="740">More context. More reality. More challenge.</text><text x="540" y="1632" fill="#526276" font-size="25">Before the answer—not after the damage.</text>
  </g>
  <path d="M70 1810 H1010" stroke="#d2dce2" stroke-width="1.5"/><text x="70" y="1860" fill="#7b8795" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">THE VIVENTIUM WAY</text>
</svg>
