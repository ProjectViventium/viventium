<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">When believable becomes dangerous</title>
  <desc id="desc">Vertical Reel frame showing how a polished wrong answer can shape a real outcome.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f7ede8"/></linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e66b56"/><stop offset="1" stop-color="#b83943"/></linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#743c35" flood-opacity="0.18"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a14f43"/></marker>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/><circle cx="980" cy="120" r="230" fill="#f5dcd0" opacity="0.65"/><circle cx="80" cy="1800" r="210" fill="#fae6cf" opacity="0.65"/>
  <text x="70" y="94" fill="#615b58" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="5">VIVENTIUM</text><text x="1010" y="94" text-anchor="end" fill="#7e7470" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650">03 / 06</text>
  <text x="70" y="270" fill="#2c2524" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="800">A wrong answer</text><text x="70" y="352" fill="#2c2524" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="800">can still feel right.</text>
  <text x="70" y="418" fill="#6a5f5b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="29">Believable words can quietly steer a real decision.</text>
  <g transform="translate(215 540)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <path d="M30 0 H620 Q650 0 650 30 V170 Q650 200 620 200 H238 L168 262 L181 200 H30 Q0 200 0 170 V30 Q0 0 30 0 Z" fill="#ffffff" stroke="#ddc9c1" stroke-width="2" filter="url(#shadow)"/>
    <text x="325" y="86" fill="#403535" font-size="39" font-weight="780">“This sounds right.”</text><text x="325" y="142" fill="#8a7670" font-size="24">polished · confident · personal</text>
    <path d="M325 276 V372" stroke="#a14f43" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="165" y="408" width="320" height="112" rx="56" fill="#f0ba76" filter="url(#shadow)"/><text x="325" y="477" fill="#513b2b" font-size="32" font-weight="800">CHOICE</text>
    <path d="M325 532 V628" stroke="#a14f43" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="165" y="664" width="320" height="112" rx="56" fill="#dc8d60" filter="url(#shadow)"/><text x="325" y="733" fill="#ffffff" font-size="32" font-weight="800">ACTION</text>
    <path d="M325 788 V884" stroke="#a14f43" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="125" y="920" width="400" height="122" rx="61" fill="url(#danger)" filter="url(#shadow)"/><text x="325" y="996" fill="#ffffff" font-size="34" font-weight="800">REAL OUTCOME</text>
  </g>
  <text x="540" y="1660" text-anchor="middle" fill="#b83943" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="820">CONFIDENT ≠ CORRECT</text>
  <text x="540" y="1712" text-anchor="middle" fill="#695c58" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">The more it matters, the more dangerous pleasing certainty becomes.</text>
  <path d="M70 1810 H1010" stroke="#ddcec8" stroke-width="1.5"/><text x="70" y="1860" fill="#8b7f7a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">THE VIVENTIUM WAY</text>
</svg>
