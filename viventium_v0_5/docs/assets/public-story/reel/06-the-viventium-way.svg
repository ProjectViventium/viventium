<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">The Viventium Way</title>
  <desc id="desc">Closing Reel frame presenting the original Viventium anti-sycophancy framework.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#162b5f"/><stop offset="0.58" stop-color="#21376c"/><stop offset="1" stop-color="#173f4c"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cb4ff"/><stop offset="0.5" stop-color="#bba6ff"/><stop offset="1" stop-color="#85ddba"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/><circle cx="930" cy="180" r="320" fill="url(#halo)"/><circle cx="100" cy="1790" r="280" fill="url(#halo)" opacity="0.55"/>
  <text x="70" y="94" fill="#dce4ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="5">VIVENTIUM</text><text x="1010" y="94" text-anchor="end" fill="#b7c2df" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650">06 / 06</text>
  <text x="70" y="275" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="78" font-weight="820">The Viventium Way</text>
  <text x="70" y="350" fill="#d8e1f9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="31">My solution was not to make AI argue.</text><text x="70" y="406" fill="#9fe0c2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="31" font-weight="720">It was to change what it knows before it answers.</text>
  <g transform="translate(180 560)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <path d="M64 48 V770" stroke="#8fa6dc" stroke-width="9" stroke-linecap="round"/><path d="M64 48 V770" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="64" cy="48" r="48" fill="#dfe7ff" stroke="#ffffff" stroke-width="5"/><text x="150" y="38" fill="#ffffff" font-size="31" font-weight="800">UNDERSTAND YOU</text><text x="150" y="80" fill="#bdc9e6" font-size="23">your actual world</text>
    <circle cx="64" cy="288" r="48" fill="#e4ddff" stroke="#ffffff" stroke-width="5"/><text x="150" y="278" fill="#ffffff" font-size="31" font-weight="800">KEEP THINKING</text><text x="150" y="320" fill="#bdc9e6" font-size="23">quiet specialists in the background</text>
    <circle cx="64" cy="528" r="48" fill="#d9f6e9" stroke="#ffffff" stroke-width="5"/><text x="150" y="518" fill="#ffffff" font-size="31" font-weight="800">CHECK REALITY</text><text x="150" y="560" fill="#bdc9e6" font-size="23">beyond the conversation</text>
    <circle cx="64" cy="768" r="48" fill="#bcf0d4" stroke="#ffffff" stroke-width="5"/><text x="150" y="758" fill="#ffffff" font-size="31" font-weight="800">CHALLENGE ITSELF</text><text x="150" y="800" fill="#bdc9e6" font-size="23">before answering</text>
  </g>
  <rect x="90" y="1550" width="900" height="150" rx="75" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
  <text x="540" y="1610" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="35" font-weight="760">Not a yes-machine.</text><text x="540" y="1658" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27">A thinking partner grounded in your life and the world.</text>
  <text x="70" y="1860" fill="#b8c5e3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">AN ORIGINAL ANTI-SYCOPHANCY FRAMEWORK</text>
</svg>
