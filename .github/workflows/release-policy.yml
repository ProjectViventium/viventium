name: Release Policy

# Owns the four public policy files declared in select_release_tests.py.
# All pytest workflows resolve the same typed QA mode before setup.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: QA mode (full is explicit only)
        type: choice
        options: [skip, critical-path, blast-radius, full]
        default: blast-radius
      base:
        description: Required comparison ref for manual blast-radius (no guessed fallback)
        type: string
        default: ''
      tests:
        description: Critical-path JSON array of release file/node selectors
        type: string
        default: '[]'
      live_refs:
        description: Verify public main component pins (ignored by skip)
        type: boolean
        default: false
      reason:
        description: Required reason for critical-path selection
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Validate public release policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select release tests for this change
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          SELECT_PARTITION: policy
        run: |
          python3 scripts/viventium/select_release_tests.py \
            --event-file "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            --partition "$SELECT_PARTITION" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.select.outputs.count != '0'
        with:
          python-version: "3.11"
      - name: Record hosted Python toolchain
        if: steps.select.outputs.count != '0'
        run: python -VV
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.select.outputs.node == 'true'
        with:
          node-version: "24"
      - name: Install test runner
        if: steps.select.outputs.count != '0'
        run: python -m pip install pytest==8.4.2 pyyaml==6.0.2
      - name: Fetch and validate selected pinned components
        if: steps.select.outputs.components_count != '0'
        env:
          SELECTED_COMPONENTS: ${{ steps.select.outputs.components_json }}
        run: |
          python - <<'PYTHON'
          import json, os, subprocess, sys
          names = json.loads(os.environ["SELECTED_COMPONENTS"])
          if not names:
              raise SystemExit("component step requires an explicit non-empty selection")
          command = [sys.executable, "scripts/viventium/bootstrap_components.py", "--repo-root", "."]
          for name in names:
              command += ["--component", name]
          subprocess.run(command + ["--jobs", "1"], check=True)
          subprocess.run(command + ["--validate-only", "--strict-pinned"], check=True)
          PYTHON
      - name: Run selected release tests
        if: steps.select.outputs.count != '0'
        env:
          SELECTED_TESTS: ${{ steps.select.outputs.tests_json }}
        run: |
          python - <<'PYTHON'
          import json, os, subprocess, sys
          selected = json.loads(os.environ["SELECTED_TESTS"])
          if not selected:
              raise SystemExit("pytest requires an explicit non-empty selection")
          subprocess.run([sys.executable, "-m", "pytest", "-q", *selected], check=True)
          PYTHON
      - name: Verify merged component refs are live public main tips
        if: steps.select.outputs.live_refs == 'true'
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time

          lock = json.loads(Path("components.lock.json").read_text(encoding="utf-8"))
          if lock.get("publication_state") != "merged":
              raise SystemExit("components.lock.json must declare publication_state=merged")

          origin_pattern = re.compile(
              r"https://github\.com/ProjectViventium/[A-Za-z0-9_.-]+\.git"
          )
          # xPerfect is published by its own organization: allow that one repository at its path.
          xperfect = ("viventium_v0_4/xPerfect", "https://github.com/xPerfectAI/xPerfect.git")
          sha_pattern = re.compile(r"[0-9a-f]{40}")
          errors = []
          components = lock.get("components")
          if not isinstance(components, list) or not components:
              raise SystemExit("components.lock.json must contain a non-empty components list")

          for component in components:
              name = component.get("name", "<unnamed>")
              origin = component.get("origin", "")
              expected_ref = component.get("ref", "")
              if not (origin_pattern.fullmatch(origin) or (component.get("path"), origin) == xperfect):
                  errors.append(f"{name}: origin is outside the public component allowlist")
                  continue
              if not sha_pattern.fullmatch(expected_ref):
                  errors.append(f"{name}: ref is not a full lowercase commit SHA")
                  continue

              result = None
              failure_detail = "public main lookup did not run"
              for attempt in range(1, 4):
                  try:
                      result = subprocess.run(
                          [
                              "git",
                              "-c", "credential.helper=",
                              "-c", "http.followRedirects=false",
                              "ls-remote", "--exit-code", "--refs",
                              origin, "refs/heads/main",
                          ],
                          check=False,
                          capture_output=True,
                          text=True,
                          timeout=15,
                          env={**os.environ, "GIT_TERMINAL_PROMPT": "0"},
                      )
                      if result.returncode == 0:
                          break
                      stderr_lines = result.stderr.strip().splitlines()
                      detail = stderr_lines[-1][:240] if stderr_lines else "no error detail"
                      failure_detail = f"git exited {result.returncode}: {detail}"
                  except subprocess.TimeoutExpired:
                      failure_detail = "lookup timed out after 15 seconds"
                  if attempt < 3:
                      time.sleep(attempt)
              if result is None or result.returncode != 0:
                  errors.append(f"{name}: could not read public main ({failure_detail})")
                  continue

              lines = [line.split() for line in result.stdout.splitlines() if line.strip()]
              if len(lines) != 1 or len(lines[0]) != 2 or lines[0][1] != "refs/heads/main":
                  errors.append(f"{name}: public main returned an unexpected ref response")
                  continue
              actual_ref = lines[0][0]
              if actual_ref != expected_ref:
                  errors.append(
                      f"{name}: lock ref {expected_ref} does not equal public main {actual_ref}"
                  )

          if errors:
              for error in errors:
                  print(f"ERROR: {error}", file=sys.stderr)
              raise SystemExit(1)
          print(f"Verified {len(components)} merged component refs against public main tips")
          PY
