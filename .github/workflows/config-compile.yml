name: Config Compile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: config-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Easy Install core (${{ matrix.expected_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            expected_arch: arm64
          - runner: macos-15-intel
            expected_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      EXPECTED_ARCH: ${{ matrix.expected_arch }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify runner architecture
        run: test "$(uname -m)" = "$EXPECTED_ARCH"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Resolve the newest available 3.12 patch for each hosted macOS architecture.
          python-version: "3.12"
      - name: Record hosted Python toolchain
        run: python -VV
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - run: >-
          python -m pip install
          -r scripts/viventium/requirements.txt
          pytest==8.4.2
          pydantic==2.12.5
          croniter==6.0.0
          fastapi==0.141.1
          fastmcp==3.4.5
          httpx==0.28.1
          uv==0.11.28
      - name: Fetch and validate the exact configured components
        run: |
          python scripts/viventium/bootstrap_components.py \
            --repo-root "$PWD" \
            --config config.full.example.yaml \
            --jobs 1
      - name: Install LibreChat workspace dependencies
        working-directory: viventium_v0_4/LibreChat
        run: |
          npm ci --ignore-scripts
          npm run build:packages
      - name: Install modern playground dependencies
        working-directory: viventium_v0_4/agent-starter-react
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Run cross-architecture installer and payload policy suites
        run: |
          python -m pytest tests/release/ -q
      - name: Run Telegram smart-delivery regression suite
        run: |
          git ls-files --error-unmatch \
            viventium_v0_4/telegram-viventium/tests/test_telegram_chunks.py
          cd viventium_v0_4/telegram-viventium
          uv run --project TelegramVivBot --frozen \
            --with pytest==8.4.2 --with pytest-asyncio==1.4.0 \
            python -m pytest -q tests
