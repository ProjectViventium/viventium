  rule: >-
    The 288 retained REQUIRED IDs have exact owner, natural-use-case, and QA-case declarations.
    Product ownership is a unique exact stable-ID declaration in a requirements document; QA is
    acceptance only. Locator line digests prevent an unrelated heading, mention, or shifted line
    from satisfying the join.
    This is documentation traceability, not an implicit product PASS claim. The remaining missing
    joins belong only to superseded, open, reference/review, conflict, or audit-gap rows; each has a
    stable MISSING-JOIN record in the private crosswalk. Superseded history is excluded from
    QA/use-case missing counts but remains in the stable-ID inventory.

