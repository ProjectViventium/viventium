disposition_vocabulary:
  required_as_of_field: disposition_as_of
  allowed:
    captured_acceptance_open: Source requirements are captured, but no family-level current acceptance is claimed because required acceptance is incomplete or unrun.
    captured_live_acceptance_failed: Current live evidence directly failed at least one required acceptance gate.
    captured_acceptance_partial: Current evidence proves only a stated subset; completion is not claimed.
    captured_current_source_contract_failed: The current source candidate fails deterministic contract checks before full installed acceptance.
    reconciled_documentation_contract_partial_source_retention: The documentation contract is reconciled for retained sources, but historical retention and/or durability is partial.
    reconciled_current_instruction_contract: Current shared development instructions are reconciled; each future change must still prove compliance.
    captured_live_acceptance_passed: The named scoped live path passed; the stated wider gates remain separate.
    captured_live_analysis_failed: Acquisition or supporting work ran, but the required current analysis result failed or lacks verified completion.
    captured_release_acceptance_open: Release requirements are captured, but release acceptance is not complete.
    not_current_runtime_truth: Proposal context is retained but does not define the current runtime.
    not_automatically_adopted: Research is input only until a user or owning requirement explicitly adopts it.
    supports_existing_requirements: Operational evidence supports existing requirements but creates no independent product requirement.
    excluded_from_viventium_product_truth: The source is outside Viventium product truth unless later explicitly adopted.
    qa_evidence_only: Automation replay is evidence only and cannot create a human requirement.
    trace_to_human_parent: Agent-derived work inherits its human parent and is not an independent requirement source.
    retained_private_not_promoted_without_specific_adoption: Recoverable human context remains private and is not promoted without specific adoption.

