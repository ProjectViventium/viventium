    private verified annex. This public family file is not the 360-row stable-ID inventory; exact
    per-message source attribution stays private. The 288 REQUIRED IDs have canonical public owner
    declarations in their owning product documents. This file records reusable source-family
    outcomes and their owning requirement and QA contracts. Repeated messages reuse context-qualified semantic
    requirement/disposition aliases. Each alias is bound to the exact retained UTF-8 human-
    requirement payload after documented app-envelope, attachment, and image exclusions; the raw
    user-role payload has a separate verified hash. “Atomic” means one semantic requirement or
    explicit no-requirement disposition per alias, not an inferred subclause offset. This file is
    not the generated product/service
    source-to-pin-to-artifact-to-installed-to-QA registry required by ONB-011; that structural gap
    remains open.
