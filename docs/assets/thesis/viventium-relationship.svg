<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">How the Viventium system is formed</title>
  <desc id="desc">The best available intelligence and What Makes You connect, synchronize, and remain always present. Together they form You'ified AI. You'ified AI plus the living You equals Viventium.</desc>
  <defs>
    <linearGradient id="join" x1="200" y1="250" x2="1000" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64748B"/>
      <stop offset=".5" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="equation-surface" x1="80" y1="500" x2="1120" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity=".04"/>
      <stop offset=".5" stop-color="#22D3EE" stop-opacity=".11"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity=".04"/>
    </linearGradient>
  </defs>
  <style>
    :root {
      color-scheme: light dark;
      --surface: #F8FAFC;
      --surface-2: #FFFFFF;
      --ink: #0F172A;
      --muted: #64748B;
      --line: #CBD5E1;
      --accent: #0E7490;
      --accent-bright: #0891B2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #0A0F12;
        --surface-2: #0E1519;
        --ink: #F8FAFC;
        --muted: #94A3B8;
        --line: #26343B;
        --accent: #67E8F9;
        --accent-bright: #22D3EE;
      }
    }
    text {
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: var(--ink);
      text-rendering: geometricPrecision;
    }
    .muted { fill: var(--muted); }
    .accent { fill: var(--accent); }
  </style>

  <rect x="1" y="1" width="1198" height="698" rx="26" fill="var(--surface)" stroke="var(--line)"/>

  <text x="64" y="62" class="muted" font-size="18" font-weight="600" letter-spacing="4">THE VIVENTIUM RELATIONSHIP</text>
  <text x="1136" y="62" class="muted" font-size="17" text-anchor="end">human augmentation, not a model persona</text>

  <g>
    <rect x="64" y="108" width="500" height="166" rx="18" fill="var(--surface-2)" stroke="var(--line)"/>
    <text x="96" y="148" class="muted" font-size="15" font-weight="700" letter-spacing="2.5">INTELLIGENCE SUPPLY</text>
    <text x="96" y="199" font-size="34" font-weight="680" letter-spacing="-1">Best available intelligence</text>
    <text x="96" y="238" class="muted" font-size="19">AGI → ASI → AUI · replaceable over time</text>

    <rect x="636" y="108" width="500" height="166" rx="18" fill="var(--surface-2)" stroke="var(--line)"/>
    <text x="668" y="148" class="muted" font-size="15" font-weight="700" letter-spacing="2.5">PERSONAL REALITY</text>
    <text x="668" y="199" font-size="34" font-weight="680" letter-spacing="-1">What Makes You</text>
    <text x="668" y="236" class="muted" font-size="18">memory · values · taste · relationships</text>
    <text x="668" y="262" class="muted" font-size="18">ambition · history · preferences · current life</text>

    <path d="M314 274 C314 316 404 320 438 342" fill="none" stroke="url(#join)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M886 274 C886 316 796 320 762 342" fill="none" stroke="url(#join)" stroke-width="3.5" stroke-linecap="round"/>

    <rect x="236" y="332" width="728" height="84" rx="42" fill="var(--surface-2)" stroke="var(--accent)" stroke-width="2.5"/>
    <text x="600" y="382" text-anchor="middle" class="accent" font-size="20" font-weight="740" letter-spacing="2.8">CONNECTED · SYNCHRONIZED · ALWAYS THERE</text>

    <path d="M600 416 L600 472" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="600" cy="472" r="5" fill="var(--accent-bright)"/>

    <rect x="64" y="470" width="1072" height="156" rx="22" fill="url(#equation-surface)" stroke="var(--line)"/>
    <text x="108" y="509" class="muted" font-size="15" font-weight="700" letter-spacing="2.5">THE EXACT EQUATION</text>

    <g transform="translate(142 566)">
      <text font-size="42" font-weight="700" letter-spacing="-1.3">YOU'IFIED AI</text>
      <text x="283" class="muted" font-size="38">+</text>
      <text x="334" font-size="42" font-weight="700">YOU</text>
      <text x="438" class="muted" font-size="38">=</text>
      <text x="490" class="accent" font-size="54" font-weight="760" letter-spacing="-2">VIVENTIUM</text>
    </g>

    <text x="600" y="607" text-anchor="middle" class="muted" font-size="17">the user-owned exocortex you can inhabit and ride</text>
  </g>

  <text x="64" y="665" class="muted" font-size="16">Joined to your authorized life. Not a model imitating your tone.</text>
</svg>
