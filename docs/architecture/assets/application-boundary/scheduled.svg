<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="scheduled-title scheduled-desc" style="font-family:Arial,Helvetica,sans-serif"><title id="scheduled-title">Scheduled request</title><desc id="scheduled-desc">Three clear owners: Viventium cognition and inputs, xPerfect AI orchestration and clock, Viventium results and channel delivery. A scheduled wake enters the same normal cognitive path.</desc><defs><marker id="scheduled-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#738297"/></marker></defs><rect width="1200" height="790" fill="#0d1119"/><rect x="24" y="22" width="1152" height="204" rx="13" fill="#111e29" stroke="#4b8faa" stroke-dasharray="9 7"/><text x="44" y="52" fill="#c6d7ec" font-size="18" font-weight="600">VIVENTIUM · cognition, channels and application policy</text><rect x="24" y="284" width="1152" height="202" rx="13" fill="#151a27" stroke="#7383ac" stroke-dasharray="9 7"/><text x="44" y="314" fill="#c6d7ec" font-size="18" font-weight="600">xPERFECT · generic AI, orchestration, workers and clock</text><rect x="24" y="546" width="1152" height="220" rx="13" fill="#111e29" stroke="#4b8faa" stroke-dasharray="9 7"/><text x="44" y="576" fill="#c6d7ec" font-size="18" font-weight="600">VIVENTIUM · authored answer and selected delivery</text><rect x="46" y="84" width="310" height="110" rx="12" fill="#152330" stroke="#4b8faa"/><text x="64" y="116" fill="#f4f6fb" font-size="21" font-weight="600">Scheduled wake</text><text x="64" y="146" fill="#b8c1d0" font-size="17" font-weight="400">Verify signed POST</text><text x="64" y="170" fill="#b8c1d0" font-size="17" font-weight="400">Admit once, recover receipt</text><rect x="444" y="84" width="310" height="110" rx="12" fill="#152330" stroke="#4b8faa"/><text x="462" y="116" fill="#f4f6fb" font-size="21" font-weight="600">Current cognitive context</text><text x="462" y="146" fill="#b8c1d0" font-size="17" font-weight="400">Life · memory · Feelings</text><text x="462" y="170" fill="#b8c1d0" font-size="17" font-weight="400">Prompts · tools · cortices</text><rect x="842" y="84" width="310" height="110" rx="12" fill="#152330" stroke="#4b8faa"/><text x="860" y="116" fill="#f4f6fb" font-size="21" font-weight="600">Thin client adapter</text><text x="860" y="146" fill="#b8c1d0" font-size="17" font-weight="400">Typed identity and grants</text><text x="860" y="170" fill="#b8c1d0" font-size="17" font-weight="400">Full authorized originals</text><path d="M356 139H444" fill="none" stroke="#738297" stroke-width="2" marker-end="url(#scheduled-arrow)"/><path d="M754 139H842" fill="none" stroke="#738297" stroke-width="2" marker-end="url(#scheduled-arrow)"/><path d="M998 194V254H36V401H46" fill="none" stroke="#738297" stroke-width="2" marker-end="url(#scheduled-arrow)"/><rect x="46" y="346" width="310" height="110" rx="12" fill="#151b25" stroke="#354154"/><text x="64" y="378" fill="#f4f6fb" font-size="21" font-weight="600">Configured Queen</text><text x="64" y="408" fill="#b8c1d0" font-size="17" font-weight="400">Direct fast model or harness</text><text x="64" y="432" fill="#b8c1d0" font-size="17" font-weight="400">Answers / exact work control</text><rect x="444" y="346" width="310" height="110" rx="12" fill="#151b25" stroke="#354154"/><text x="462" y="378" fill="#f4f6fb" font-size="21" font-weight="600">Native workers A…N</text><text x="462" y="408" fill="#b8c1d0" font-size="17" font-weight="400">Inherited original context</text><text x="462" y="432" fill="#b8c1d0" font-size="17" font-weight="400">Full granted capabilities</text><rect x="842" y="346" width="310" height="110" rx="12" fill="#151b25" stroke="#354154"/><text x="860" y="378" fill="#f4f6fb" font-size="21" font-weight="600">Clock + outbox</text><text x="860" y="408" fill="#b8c1d0" font-size="17" font-weight="400">Owns time / repeat / retry</text><text x="860" y="432" fill="#b8c1d0" font-size="17" font-weight="400">Generic signed HTTP POST</text><pat