[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "viventium-media"
version = "0.1.3"
description = "Viventium's local image and video tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp==1.29.0", "anyio>=4,<5"]

[project.scripts]
viventium-media = "viventium_media.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/viventium_media"]

[tool.hatch.build.targets.wheel.force-include]
"config.example.toml" = "viventium_media/config.example.toml"
