services:
  provider-egress:
    image: ${VIVENTIUM_PARALLEL_PROXY_IMAGE:-viventium-parallel-work-proxy:local}
    build:
      context: .
    container_name: ${WPR_PARALLEL_CLEAN_ROOM_PROVIDER_PROXY_CONTAINER}
    restart: unless-stopped
    read_only: true
    user: glasshive
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      VIVENTIUM_PARALLEL_PROXY_ROLE: provider
      VIVENTIUM_PARALLEL_PROXY_UPSTREAM: http://host.docker.internal:${VIVENTIUM_LC_API_PORT}
      VIVENTIUM_PARALLEL_PROXY_PORT: "8080"
    labels:
      com.viventium.parallel-clean-room.policy: parallel-clean-room-v1
      com.viventium.parallel-clean-room.role: provider-proxy
    networks:
      internal:
        aliases:
          - provider-egress
      egress: {}

  capability-broker:
    image: ${VIVENTIUM_PARALLEL_PROXY_IMAGE:-viventium-parallel-work-proxy:local}
    container_name: ${WPR_PARALLEL_CLEAN_ROOM_BROKER_PROXY_CONTAINER}
    restart: unless-stopped
    read_only: true
    user: glasshive
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      VIVENTIUM_PARALLEL_PROXY_ROLE: broker
      VIVENTIUM_PARALLEL_PROXY_UPSTREAM: http://host.docker.internal:${VIVENTIUM_LC_API_PORT}
      VIVENTIUM_PARALLEL_PROXY_PORT: "8080"
    labels:
      com.viventium.parallel-clean-room.policy: parallel-clean-room-v1
      com.viventium.parallel-clean-room.role: broker-proxy
    networks:
      internal:
        aliases:
          - host.docker.internal
      egress: {}

networks:
  internal:
    name: ${WPR_PARALLEL_CLEAN_ROOM_NETWORK}
    driver: bridge
    internal: true
    labels:
      com.viventium.parallel-clean-room.policy: parallel-clean-room-v1
  egress:
    name: ${WPR_PARALLEL_CLEAN_ROOM_PROVIDER_EGRESS_NETWORK}
    driver: bridge
