version: 1
install:
  mode: native
  # Public label: Custom Settings Install. Keep this compatibility value as `custom`.
  experience: custom
settings:
  timezone: local
runtime:
  log_level: info
  profile: isolated
  background_activation:
    # Each provider attempt remains bounded by the mode's total Phase A budget. These defaults let
    # the fast Qwen primary absorb normal tail latency and leave a useful window for a fallback.
    primary_attempt_timeout_ms: 1600
    fallback_attempt_timeout_ms: 2500
  playground_variant: modern
  call_session_secret:
    secret_ref: keychain://viventium/call_session_secret
  auth:
    # Optional exact email-domain allowlist for LibreChat/local email signup and login.
    # GlassHive OIDC authorization must instead be enforced by IdP tenant/app-role policy;
    # mutable email claims never own a GlassHive workspace.
    allowed_domains: []
    # Show email-capable login when the external provider supports it. GlassHive itself does not
    # store passwords or create a second credential stack.
    allow_email_login: true
    # Browser sign-up is open by default so a new install can create its first account.
    # Once the install is reachable from outside your network, close this unless you intentionally
    # want public self-signup.
    allow_registration: true
    # Keep browser password reset off unless real email delivery is configured.
    # Safer operator path: bin/viventium password-reset-link <email>
    allow_password_reset: false
    # Optional connected-account OAuth browser return override.
    # Leave blank to return through the configured DOMAIN_SERVER/public API origin.
    # Set only for local QA/off-network operator cases, e.g. http://localhost:3190.
    connected_accounts_return_origin: ""
  network:
    # Remote browser voice calls from other devices need a real HTTPS/WSS deployment path for the
    # web UI and LiveKit media plane. Local installs should default to disabled until the operator
    # deliberately configures a supported topology.
    # Quick rule of thumb:
    # - disabled: keep everything local-only
    # - tailscale_tailnet_https: easiest path for your own devices when you can install Tailscale
    # - custom_domain/public_https_edge: best path for any browser anywhere
    #   when your router supports UPnP/NAT-PMP or you can forward the required ports manually
    # Supported modes:
    # - disabled
    # - cloudflare_quick_tunnel (experimental voice-only path; not the recommended install story)
    # - tailscale_tailnet_https (recommended for your own devices)
    # - netbird_selfhosted_mesh (OSS private-mesh path)
    # - public_https_edge (public custom-domain or zero-cost sslip.io path)
    # `custom_domain` is accepted as a clearer alias for `public_https_edge`.
    remote_call_mode: disabled
    # Optional browser-facing origins for remote-device access.
    # Leave them blank for automatic Tailscale mode or the public sslip.io fallback.
    # Set them explicitly for NetBird or your own stable public subdomains.
    # Stable public custom-domain voice access expects the first four to be set. When GlassHive is
    # enabled, set the fifth origin so returned workspace and artifact links work off this Mac.
    # If you prefer a single namespace, choose an app hostname like app.example.com and use:
    # - https://app.example.com
    # - https://api.app.example.com
    # - https://playground.app.example.com
    # - wss://livekit.app.example.com
    # - https://glasshive.app.example.com
    public_client_origin: ""
    public_api_origin: ""
    public_playground_origin: ""
    public_livekit_url: ""
    public_glasshive_origin: ""
    # Optional explicit mesh IP for LiveKit media when the public_livekit_url hostname does not
    # resolve to this Mac's private mesh address on startup. Most Tailscale installs can leave this
    # blank; NetBird operators may want to set it deliberately.
    livekit_node_ip: ""
  personalization:
    # New installs should ship with "Recall all conversations" enabled so
    # runtime recall and vector recall can activate without extra manual toggles.
    default_conversation_recall: true
  nightly_routines:
    enabled: true
    defaults_version: 1
    auto_worker_profile: true
  # Scheduled Viventium-agent runs use a deliberate automation tuple without
  # changing the lower-latency effort used by ordinary conscious chat.
  scheduled_agent:
    provider: openai
    model: gpt-5.6-sol
    reasoning_effort: xhigh
  prompt_workbench:
    enabled: true
    seed_nightly:
      enabled: true
      active: true
      executor: glasshive_host
    # Seed the private correlation definition, but keep it inactive until WHOOP is connected.
    seed_health_context:
      enabled: true
      active: false
      executor: glasshive_host
  feelings:
    # The panel is installed, but every new user's Feelings switch starts off.
    available: true
    default_enabled: false
    # all_agents gives every Viventium agent and brokered worker the same turn-pinned state.
    # Use conscious_agent to restrict the capsule to the visible main agent.
    agent_scope: all_agents
    reaction:
      # always is the natural default. classified reuses the existing cortex activation detector.
      activation_mode: always
      provider: openai
      model: gpt-5.6-terra
      use_responses_api: true
      reasoning_effort: none
      # Fast maps to OpenAI Priority processing; service_tier remains explicit and overridable.
      fast: true
      service_tier: priority
      timeout_ms: 15000
      # A declared recovery route keeps the detached reaction moving if Terra times out.
      # Set fallback_provider to none to disable it.
      fallback_provider: anthropic
      fallback_model: claude-opus-5
      activation_provider: groq
      activation_model: qwen/qwen3.6-27b
      activation_confidence_threshold: 0.55
      activation_timeout_ms: 2000
    bands:
      energy: { enabled: true, baseline: 56, half_life_minutes: 240 }
      mood: { enabled: true, baseline: 58, half_life_minutes: 360 }
      drive: { enabled: true, baseline: 62, half_life_minutes: 480 }
      curiosity: { enabled: true, baseline: 66, half_life_minutes: 45 }
      vigilance: { enabled: true, baseline: 68, half_life_minutes: 20 }
      care: { enabled: true, baseline: 74, half_life_minutes: 1440 }
      connection: { enabled: true, baseline: 52, half_life_minutes: 480 }
      openness: { enabled: true, baseline: 55, half_life_minutes: 180 }
      play: { enabled: true, baseline: 48, half_life_minutes: 90 }
  memory_hardening:
    # Semantic hardening is enabled by the supported local nightly-routines contract.
    # It runs only for local users whose memories are enabled; operator_user_email can
    # scope it to one account, and an empty value means all eligible local users.
    enabled: true
    schedule: "0 3 * * *"
    timezone: local
    # Optional: scope hardening to one local account email. Empty means all local users.
    operator_user_email: ""
    provider: ""
    lookback_days: 7
    min_user_idle_minutes: 60
    max_changes_per_user: 3
    max_input_chars: 500000
    require_full_lookback: true
    dry_run_first: true
    provider_profile: launch_ready_only
    anthropic_model: claude-opus-5
    anthropic_effort: xhigh
    openai_model: gpt-5.6-luna
    openai_reasoning_effort: medium
    transcripts:
      # Optional local folder for meeting transcripts. Empty disables transcript ingestion.
      source_dir: ""
      max_files_per_run: 20
      max_chars_per_file: 500000
      summary_max_chars: 32000
      stable_evidence_max_age_days: 90
      rag_mode: detailed_summary_only
  dev_env:
    # Set by `bin/viventium dev-env create`; normal installs leave this off.
    enabled: false
    name: ""
    port_offset: 1000
    shared_singleton_services:
      - recall_rag
      - searxng
      - firecrawl
      - google_workspace_mcp
      - ms365_mcp
  # Shared background follow-up window for LibreChat, live voice, and Telegram.
  # This is the Phase B window that still allows a late main-agent follow-up to surface
  # after background insights finish.
  background_followup_window_s: 30
  # Optional foreground Agent Provider deadline. Omit by default; operators may set 30-1800.
  extra_env:
    # Advanced/private local carry-over for legacy provider settings that still need
    # environment-based LibreChat runtime wiring. Public installs can usually leave this empty.
    AZURE_AI_FOUNDRY_API_KEY: keychain://viventium/azure_ai_foundry_api_key
    AZURE_OPENAI_API_INSTANCE_NAME: aoai-example-instance
    AZURE_OPENAI_API_KEY: keychain://viventium/azure_openai_api_key
    VIVENTIUM_FOUNDRY_ANTHROPIC_REVERSE_PROXY: https://example.services.ai.azure.com/anthropic/v1
  ports:
    lc_api_port: 3180
    lc_frontend_port: 3190
    sandpack_bundler_port: 3191
    playground_port: 3300
    prompt_workbench_port: 8781
    voice_gateway_health_port: 8301
    mongo_port: 27117
    meili_port: 7700
    google_mcp_port: 8111
    scheduling_mcp_port: 7110
    rag_api_port: 8110
    code_interpreter_port: 8101
    skyvern_api_port: 8200
    skyvern_ui_port: 8280
    livekit_http_port: 7888
    livekit_tcp_port: 7889
    livekit_udp_port: 7890
agents:
  default_main_agent_id: agent_viventium_main_95aeb3
llm:
  activation:
    provider: groq
    auth_mode: api_key
    secret_ref: keychain://viventium/groq_api_key
  primary:
    provider: openai
    # Experimental legacy bridge for compatible existing installs. New Easy Install users use the
    # browser-entered encrypted API-key path until the vendor-owned client integration is shipped.
    auth_mode: connected_account
  secondary:
    provider: anthropic
    auth_mode: api_key
    secret_ref: keychain://viventium/anthropic_api_key
  # Optional saved-memory writer selection. Omit to follow foundation-provider priority.
  # The provider must already be authenticated above; this does not configure automatic fallback.
  # memory:
  #   provider: anthropic
  #   model: claude-opus-5
  extra_provider_keys:
    openrouter: keychain://viventium/openrouter_api_key
voice:
  # The public full example must compile on every supported host. Enable one complete route
  # explicitly: `local` is Apple-Silicon-only and never falls back to cloud; `hosted` requires
  # configured provider credentials.
  mode: disabled
  stt_provider: whisper_local
  # For Intel Macs or other machines where local audio is unavailable, explicitly switch the whole
  # voice mode to hosted instead of relying on silent local-to-cloud rewrites:
  # mode: hosted
  # stt_provider: assemblyai
  # stt:
  #   secret_ref: keychain://viventium/assemblyai_api_key
  #   # The shipped AssemblyAI `stt` path keeps local endpointing delay near zero and
  #   # lets provider endpointing own turn timing. When these are left unset, the
  #   # compiler emits the current documented Universal Streaming defaults so runtime
  #   # behavior is explicit and reproducible. The existing config key below is kept
  #   # for backward compatibility and maps to AssemblyAI's current `min_turn_silence`
  #   # provider knob.
  #   end_of_turn_confidence_threshold: 0.01
  #   min_end_of_turn_silence_when_confident_ms: 100
  #   max_turn_silence_ms: 1000
  # Turn-taking / end-of-utterance tuning (all optional; sensible defaults apply when omitted).
  # Balances two failure modes: do not cut the user off on a short reflective pause, but do not
  # feel sluggish after a real stop. See docs/requirements_and_learnings/06_Voice_Calls.md.
  turn_handling:
    min_endpointing_delay_s: 0.35   # floor before the turn can end (keep short for snappiness)
    max_endpointing_delay_s: 0.8    # ceiling the semantic detector may wait for more speech
                                    # (lower = faster end-of-turn; default 1.8 felt slow at ~1.4s p50)
  # Local mode is an all-local egress boundary. Apple Silicon resolves this explicit automatic
  # choice to the shipped local Chatterbox route; unsupported hosts fail closed during compile.
  tts_provider: browser
  wing_mode:
    prompt: |-
      WING MODE:
      - You are in Wing Mode during a live voice call: quietly aware, helpful, and unobtrusive.
      - Treat TV, podcasts, videos, songs, meetings, and nearby chatter as background context unless the user is clearly talking to you.
      - A live call does not mean every spoken sentence is addressed to you; a bare spoken question, comment, or thought in the room is background unless the user directly addresses you or it clearly requires your memory, tools, or role in the call.
      - If you do not have a clear, useful, additive contribution, output exactly {NTA}.
      - If you are not sure the user is addressing you, output exactly {NTA}.
      - Err aggressively on the side of silence.
  tts:
    voice: coral
    speed: 1.12
    instructions: Speak naturally with clear pacing. Keep the delivery conversational, grounded, and human. Avoid robotic emphasis or exaggerated pauses.
integrations:
  health:
    enabled: true
    # Optional metadata-only connector status projection. Raw health evidence stays in App Support.
    life_projection_dir: ~/Documents/Viventium/Life/Health/Wearables/WHOOP
  glasshive:
    enabled: true
    provider:
      enabled: true
      # Defaults to the local GlassHive API for a source/Docker runtime.
      # base_url: http://127.0.0.1:8766/v1
      # life_dir: ~/Documents/Viventium/Life
      # Full is the trusted-local default and disables harness sandbox/approval gates.
      # Use workspace/false for a restricted deployment.
      default_access: full
      allow_full_access: true
    host_worker:
      enabled: true
      workspace_root: ~/viventium
      # Worker runtime profile: codex-cli, claude-code, or openclaw-general.
      # Separate from the integrations.openclaw lab toggle below.
      default_worker_profile: codex-cli
      default_execution_mode: host
      plugin_denylist: ["viventium-feelings@project-viventium"]
      # Viventium Feelings owns emotional state; disable Codex's separate style layer by default.
      codex_personality: none
      # Run in the exact chosen folder and honor its canonical AGENTS.md by default.
      codex_conversation_project_instructions: inherit
      # Optional native-capability controls. Leave unset for the default full-capability path.
      # runtime_requirements:
      #   json:
      #     claude-code:
      #       required_help_flags: ["--chrome"]
      #     codex-cli:
      #       required_mcp_servers: ["computer-use", "node_repl"]
      # codex_native_mcp_allowlist: ["computer-use", "node_repl"]
      # codex_plugin_cache: ""
      # codex_ignore_user_config: false
      # codex_disable_features: ""
      # Keep native browsing by default. Set disabled only when a controlled QA/enterprise run must
      # prove that an assigned broker web capability cannot be bypassed by the worker CLI.
      # native_web_access: inherit
      # Quality-first default for host Codex work and unattended analytical automations.
      codex_model: gpt-5.6-sol
      codex_reasoning_effort: xhigh
      codex_xhigh_route_proven: true
      # Override only for a deployment whose directly tested route supports a different subset.
      # codex_allowed_reasoning_efforts: ["none", "low", "medium", "high", "xhigh"]
      # codex_reasoning_effort_fallback: high
      # claude_enable_chrome: true
    # Enterprise-only owner identity bridging. Defaults are strict user_id matching and no aliases.
    # Use explicit aliases only when browser auth identity and MCP/chat owner identity are known to
    # represent the same user in a non-SSO deployment.
    # enterprise:
    #   # Persistent runtime/control-plane state. The gateway auth database is kept in a
    #   # gateway-only child directory while runtime SQLite files use the shared state group.
    #   state_dir: /var/lib/glasshive
    #   # New multi-user deployments use signed internal assertions. Existing integrations can
    #   # remain on legacy_compatibility until their gateway and key volume are ready.
    #   security_mode: multi_user
    #   tenant_id: example-tenant
    #   # One stable claim must identify the same person in browser and MCP tokens.
    #   # Microsoft Entra ID deployments normally use oid.
    #   principal_claim: oid
    #   human_auth:
    #     # Multi-user mode requires Glass Drive Authorization Code + PKCE directly. Plain reverse-
    #     # proxy identity headers are not accepted as an authentication boundary.
    #     mode: oidc
    #     # These are separate controls. The first only describes a provider-hosted sign-in
    #     # capability; the second controls GlassHive principal creation after IdP admission.
    #     # Keep enrollment false for an administrator-preapproved enterprise deployment.
    #     provider_email_login: true
    #     allow_principal_enrollment: false
    #     # Optional, default-off GlassHive-local browser credential for administrator-preapproved
    #     # OIDC subjects. It never creates a public signup/reset path or an MCP password grant.
    #     # Email is only the credential locator; issuer + subject remain the durable owner.
    #     local_password_login: false
    #     local_password_allowed_domains:
    #       - example.com
    #     # Enforce tenant/domain admission in the IdP with user/group assignment and app roles.
    #     # One Entra app registration may serve both the confidential web client and exposed API
    #     # resource; separate registrations remain supported. Require assignment on every
    #     # enterprise application used, or prove an equivalent deny-by-default role/admission gate.
    #     # Never flip an existing shared application's assignment policy without auditing its current
    #     # consumers. allow_principal_enrollment only enrolls a principal after the IdP admission
    #     # boundary; it never enables identity-provider or GlassHive public sign-up.
    #     # runtime.auth.allowed_domains is only the LibreChat/local email-login policy.
    #     oidc:
    #       issuer: https://identity.example.com/tenant/v2.0
    #       client_id: glasshive-ui
    #       client_secret:
    #         secret_ref: keychain://viventium/glasshive_oidc_client_secret
    #       redirect_uri: https://glasshive.example.com/auth/oidc/callback
    #       # Register this exact URI in the IdP's post-logout redirect allowlist. It defaults to
    #       # the public operator origin plus /login when omitted.
    #       post_logout_redirect_uri: https://glasshive.example.com/login
    #       # Email is display metadata only; issuer + oid own the durable account.
    #       email_claim: email
    #       role_claim: roles
    #       role_map:
    #         GlassHive.Member: member
    #         GlassHive.Viewer: viewer
    #         GlassHive.TenantAdmin: tenant_admin
    #   internal_assertion:
    #     private_key_file: /run/secrets/glasshive-internal-assertion.pem
    #     key_id: glasshive-gateway-1
    #     # During rotation only: publish the previous PUBLIC key for an absolute 180-900 second
    #     # overlap. Remove both fields after the expiry; never put an old private key here.
    #     # previous_public_jwks_file: /run/secrets/glasshive-previous-public.jwks.json
    #     # previous_keys_expire_at: <unix-epoch-seconds>
    #   mcp_oauth:
    #     enabled: true
    #     issuer: https://identity.example.com/tenant/v2.0
    #     public_url: https://glasshive.example.com/mcp
    #     # The Entra v2 access-token aud is the combined web/API app client-id GUID in combined
    #     # mode, or the dedicated API app client-id GUID in split mode. It is not the public MCP
    #     # URL used for RFC 8707 resource selection.
    #     token_audiences: [<glasshive-api-app-client-id-guid>]
    #     # Optional upstream Entra tid validation. This is not the GlassHive tenant namespace.
    #     token_tenant_id: <entra-directory-tenant-guid>
    #     # Entra emits the short delegated permission name in the JWT scp claim.
    #     token_scopes: [user_impersonation]
    #     required_scopes: [api://<glasshive-api-app-client-id-guid>/user_impersonation]
    #     # Register the approved Codex/Claude public clients in the configured IdP and list their
    #     # exact access-token client ids here. Same-audience tokens from other clients are rejected.
    #     allowed_client_ids: [glasshive-codex-client, glasshive-claude-client]
    #     # Entra does not provide MCP dynamic client registration. Configure only real,
    #     # pre-registered public clients and repeat their ids in allowed_client_ids.
    #     clients:
    #       claude:
    #         client_id: <pre-registered-claude-public-client-id>
    #         callback_port: <fixed-registered-claude-loopback-port>
    #       codex:
    #         client_id: <pre-registered-codex-public-client-id>
    #         callback_port: <fixed-registered-codex-loopback-port>
    #   provider_accounts:
    #     # Personal accounts in multi-user deployments require this reviewed substrate.
    #     isolation_mode: per_worker_container
    #     codex_subscriptions_enabled: false
    #     hosted_claude_consumer_auth_enabled: false
    #     api_key_secret_store_enabled: false
    #     connected_accounts_url: https://chat.example.com/settings/connections
    #     # Optional direct user-scoped connected-service bridge. It never copies provider
    #     # tokens into GlassHive. The URL is the explicit opt-in boundary and must be HTTPS.
    #     capability_broker:
    #       enabled: false
    #       issuer_url: https://chat.example.com/api/viventium/glasshive/capabilities/direct
    #       # shared_oidc_subject avoids per-user config when both apps use the exact same
    #       # OIDC issuer and principal claim; users link by signing in once to each app.
    #       identity_binding: shared_oidc_subject
    #       # With operator_verified instead, configure the reviewed inference_broker
    #       # owner_bindings below; inference execution itself may remain disabled.
    #       timeout_seconds: 10
    #     # Optional fixed Responses-API broker for user-scoped OpenAI API keys/routes already
    #     # owned by the connected-accounts service. No provider secret is copied to GlassHive.
    #     inference_broker:
    #       enabled: false
    #       url: https://chat.example.com/api/viventium/glasshive/inference
    #       proxy_base_url: https://chat.example.com/api/viventium/glasshive/inference
    #       timeout_seconds: 120
    #       owner_bindings:
    #         - glasshive_tenant_id: example-tenant
    #           glasshive_owner_id: canonical-owner-id
    #           librechat_user_id: connected-account-user-id
    #           proof: operator_verified
    #   workspace_links:
    #     # Default false. When true, authenticated /r/{ref} workspace links request a lifecycle
    #     # resume before redirecting. Pair with idle/watch caps so forgotten tabs release compute.
    #     auto_resume_on_open: false
    #   owner_identity:
    #     claims: [user_id]
    #     aliases:
    #       worker-owner@example.com: [browser-login-alias@example.com]
  code_interpreter:
    enabled: false
  telegram:
    enabled: true
    secret_ref: keychain://viventium/telegram_bot_token
    # Optional override for Telegram media downloads.
    # Hosted Telegram defaults to 10 MB.
    # When Viventium manages a local Bot API server below, the compiler
    # raises the default to 100 MB unless you override it here.
    # max_file_size_bytes: 10485760
    # Optional local Telegram Bot API server for large media downloads.
    # Set bot_api_origin for the usual local server shape, or use the explicit
    # base URLs if an external Bot API server is fronted differently.
    bot_api_origin: ""
    bot_api_base_url: ""
    bot_api_base_file_url: ""
    # Optional Viventium-managed local Telegram Bot API server.
    # Use this when large Telegram media must download/transcribe locally on
    # the same Mac instead of failing at Telegram's hosted Bot API ceiling.
    local_bot_api:
      enabled: false
      host: 127.0.0.1
      port: 8084
      binary_path: ""
      api_id: keychain://viventium/telegram_api_id
      api_hash: keychain://viventium/telegram_api_hash
  telegram_codex:
    enabled: false
    bot_username: your_codex_bot_username
    private_chat_only: true
  google_workspace:
    enabled: true
    account_slots: 2
    client_id: your-google-client-id.apps.googleusercontent.com
    client_secret:
      secret_ref: keychain://viventium/google_client_secret
    refresh_token:
      secret_ref: keychain://viventium/google_refresh_token
  ms365:
    enabled: true
    client_id: your-ms365-client-id
    tenant_id: your-ms365-tenant-id
    business_email: you@example.com
    client_secret:
      secret_ref: keychain://viventium/ms365_client_secret
  skyvern:
    # Optional/lab-only. Keep off unless the operator explicitly enables it.
    enabled: false
    api_key:
      secret_ref: keychain://viventium/skyvern_api_key
    base_url: http://localhost:8200
  openclaw:
    # Internal lab-only placeholder; the public installer does not expose it.
    enabled: false
feature_requests:
  pr:
    # After the user approves the generated feature or bug description and completed local result,
    # the local work-request workflow may prepare a PR automatically. When false, Viventium prompts first.
    create_after_user_approval: true
